       "workedExample":{"setup":"Du kaufst EUR/USD bei 1.0850. Stop-Loss bei 1.0830.","steps":["Abstand = 1.0850 − 1.0830 = 0.0020 = 20 Pips."],"answer":"Dein Stoppabstand beträgt 20 Pips."},
       "tryIt":"Du kaufst eine Aktie für $72, Stopp bei $69. Wie groß ist der Stoppabstand? ($3 pro Aktie)",
       "script":"Lektion drei. Den Abstand messen. Dein Einstieg ist der Preis, zu dem du kaufst. Dein Stopp ist der Preis, bei dem du aussteigst, wenn du falsch liegst. Die Lücke dazwischen ist der Stoppabstand, und hier beginnt alles bei der Positionsgröße. Im Forex-Handel misst man den Abstand in Pips. Kaufst du Euro-Dollar bei eins Komma null acht fünf null und dein Stopp liegt bei eins Komma null acht drei null, beträgt der Abstand zwanzig Pips. Bei Aktien sind es Dollar pro Aktie: Kauf bei zweiundsiebzig, Stopp bei neunundsechzig, Abstand drei Dollar. Wilde Märkte brauchen weitere Stopps. An manchen Tagen springen die Preise mehr herum. Liegt dein Stopp an einem wilden Tag zu nah, wirft dich das normale Hin und Her raus, bevor die echte Bewegung beginnt. Trader messen das typische Schwanken mit einem Werkzeug namens Average True Range. Die Mathematik brauchst du noch nicht. Merk dir nur: ruhiger Markt, näherer Stopp. Wilder Markt, weiterer Stopp – und deshalb eine kleinere Positionsgröße. Hier ist die entscheidende Verbindung für die nächste Lektion: Ein weiterer Stopp bedeutet, dass jede gekaufte Einheit mehr Dollar riskiert. Also musst du weniger Einheiten kaufen, um dasselbe Ein-Prozent-Risiko zu halten. Abstand und Größe bewegen sich immer gegenläufig."},
      "l04": {"title":"Deine erste Lot-Größen-Berechnung","tagline":"Risiko und Abstand zusammenbringen – und deine exakte Handelsgröße erhalten.","oneLiner":"Lot-Größe = Risiko in Dollar ÷ (Stoppabstand × Wert pro Einheit). Sie sagt dir genau, wie viel du kaufen darfst.","formula":"Lots = Risiko in $ ÷ (Stoppabstand in Pips × $-Wert pro Pip und Lot)",
       "sections":[
         {"h":"Die einzige Formel, die am Anfang zählt","p":["Du kennst dein Risiko in Dollar aus der 1-%-Regel. Du kennst deinen Stoppabstand aus Lektion 3. Die Lot-Größe verbindet einfach beides.","Lot-Größe = Risiko in Dollar ÷ (Stoppabstand × Wert pro Einheit). In einfachen Worten: Teile den Betrag, den du verlieren darfst, durch den Betrag, den eine Einheit verlieren würde, wenn der Stopp getroffen wird."]},
         {"h":"Ein Forex-Beispiel, ganz langsam","p":["Konto: 1,000 Dollar. Risiko bei 1%: 10 Dollar. Stoppabstand: 20 Pips. Ein Standard-Lot bewegt sich um etwa 10 Dollar pro Pip.","Größe = 10 ÷ (20 × 10) = 10 ÷ 200 = 0.05 Lots. Das sind 5,000 Einheiten, auch 5 Micro-Lots genannt. Wird der Stopp getroffen, verlierst du etwa 10 Dollar. Die Mathematik garantiert das."]},
         {"h":"Vertrau der Mathematik, nicht deinem Bauch","p":["Anfänger raten ihre Größe. Raten ist der Weg, auf dem Konten sterben. Von jetzt an beginnt jeder Trade mit drei Zahlen: Konto, Risiko-Prozent, Stoppabstand. Der Rechner liefert dir die Größe. Ganz ohne Gefühle."]}
       ],
       "workedExample":{"setup":"Konto mit $1,000, 1% Risiko = $10. Stoppabstand 20 Pips. Standard-Lot = $10/Pip.","steps":["Nenner = 20 × 10 = 200.","Lots = 10 ÷ 200 = 0.05."],"answer":"Trade 0.05 Lots. Wirst du ausgestoppt, verlierst du etwa $10."},
       "tryIt":"Konto mit $2,000, 1% Risiko ($20), Stopp über 25 Pips. Größe = 20 ÷ (25 × 10) = 0.08 Lots.",
       "script":"Lektion vier. Deine erste Lot-Größen-Berechnung. Du kennst dein Risiko in Dollar aus der Ein-Prozent-Regel. Du kennst deinen Stoppabstand aus Lektion drei. Die Lot-Größe verbindet einfach beides. Die Formel lautet: Lot-Größe gleich Risiko in Dollar, geteilt durch Stoppabstand mal Wert pro Einheit. In einfachen Worten: Teile den Betrag, den du verlieren darfst, durch den Betrag, den eine Einheit verlieren würde, wenn der Stopp getroffen wird. Machen wir ein Forex-Beispiel, ganz langsam. Konto: eintausend Dollar. Risiko bei einem Prozent: zehn Dollar. Stoppabstand: zwanzig Pips. Ein Standard-Lot bewegt sich um etwa zehn Dollar pro Pip. Größe gleich zehn geteilt durch zwanzig mal zehn. Das ist zehn geteilt durch zweihundert, also null Komma null fünf Lots. Das sind fünftausend Einheiten. Wird der Stopp getroffen, verlierst du etwa zehn Dollar. Die Mathematik garantiert das. Bau dir diese Gewohnheit auf: Anfänger raten ihre Größe, und Raten ist der Weg, auf dem Konten sterben. Von jetzt an beginnt jeder Trade mit drei Zahlen: Konto, Risiko-Prozent, Stoppabstand. Der Rechner liefert dir die Größe. Ganz ohne Gefühle."},
      "l05": {"title":"Die Lot-Größen-Formel, Schritt für Schritt","tagline":"Die universelle Formel für Aktien, Forex, Krypto und Futures.","oneLiner":"Die universelle Regel: Positionsgröße = Risiko in Dollar ÷ Stoppabstand. Sie funktioniert für Aktien, Forex, Krypto und Futures.","formula":"Aktien = Risiko in $ ÷ Stoppabstand pro Aktie",
       "sections":[
         {"h":"Eine Formel für jeden Markt","p":["Die universelle Regel: Positionsgröße = Risiko in Dollar ÷ Stoppabstand.","Bei Aktien und Krypto bewegt sich eine Aktie oder ein Coin um 1 Dollar pro 1 Dollar Preisänderung. Also: Aktien = Risiko in Dollar ÷ Stoppabstand in Dollar. Bei Forex: Lots = Risiko in Dollar ÷ (Stoppabstand in Pips × Dollar pro Pip und Lot). Bei Futures ersetzt du Dollar pro Pip durch den Tick-Wert des Kontrakts."]},
         {"h":"Ein Aktien-Beispiel","p":["Konto: 5,000 Dollar. Risiko bei 1%: 50 Dollar. Kauf bei 40, Stopp bei 38. Stoppabstand = 2 Dollar.","Aktien = 50 ÷ 2 = 25 Aktien. Wird der Stopp getroffen, verlierst du etwa 50 Dollar. Garantiert durch Mathematik, nicht durch Glück."]},
         {"h":"Drei Schritte, jedes Mal","p":["Schritt 1: Risiko in Dollar, aus deinem Konto und deinem Risiko-Prozent. Schritt 2: Stoppabstand, aus deinem Chart. Schritt 3: dividieren. Größeres Konto, größere Positionsgröße. Weiterer Stopp, kleinere Positionsgröße. Das ist das ganze Spiel."]}
       ],
       "workedExample":{"setup":"Konto mit $5,000, 1% Risiko = $50. Kauf bei $40, Stopp bei $38.","steps":["Stoppabstand = 40 − 38 = $2.","Aktien = 50 ÷ 2 = 25."],"answer":"Kaufe 25 Aktien. Wirst du ausgestoppt, verlierst du etwa $50."},
       "tryIt":"Konto mit $1,500, 2% Risiko ($30). Kauf bei $60, Stopp bei $57 ($3 Abstand). Aktien = 30 ÷ 3 = 10.",
       "script":"Lektion fünf. Die Lot-Größen-Formel, Schritt für Schritt, für jeden Markt. In der letzten Lektion hast du die Forex-Version gelernt. Jetzt kommt die universelle Regel, die überall funktioniert: Positionsgröße gleich Risiko in Dollar, geteilt durch Stoppabstand. Bei Aktien und Krypto bewegt sich eine Aktie oder ein Coin um einen Dollar pro Dollar Preisänderung. Also: Aktien gleich Risiko in Dollar geteilt durch Stoppabstand in Dollar. Beispiel: Konto fünftausend Dollar. Risiko bei einem Prozent: fünfzig Dollar. Kauf bei vierzig, Stopp bei achtunddreißig. Stoppabstand ist zwei Dollar. Fünfzig geteilt durch zwei sind fünfundzwanzig Aktien. Wird der Stopp getroffen, verlierst du etwa fünfzig Dollar – garantiert durch Mathematik. Bei Forex kommt der Pip-Wert-Schritt dazu: Lots gleich Risiko in Dollar geteilt durch Stoppabstand in Pips mal Dollar pro Pip und Lot. Bei Futures ersetzt du Dollar pro Pip durch den Tick-Wert. Die Form ist immer dieselbe. Schritt eins: Risiko in Dollar aus Konto und Risiko-Prozent. Schritt zwei: Stoppabstand aus deinem Chart. Schritt drei: dividieren. Änderst du einen Wert, ändert sich die Größe automatisch richtig. Größeres Konto, größere Größe. Weiterer Stopp, kleinere Größe. Das ist das ganze Spiel."},
      "l06": {"title":"Pips, Punkte, Ticks und Kontrakte","tagline":"Übersetze den Fachjargon jedes Marktes in Dollar pro Bewegung.","oneLiner":"Ein Pip ist der kleinste übliche Preisschritt im Forex. Lot-Namen beschreiben einfach, wie viele Einheiten du kontrollierst.","formula":"1 Standard-Lot = 100,000 Einheiten · 1 Mini = 10,000 · 1 Micro = 1,000",
       "sections":[
         {"h":"Jeder Markt hat sein eigenes Lineal","p":["Forex: Der klassische Schritt ist der Pip. Bei den meisten Paaren ist ein Pip 0.0001. Bewegt sich EUR/USD von 1.0850 auf 1.0860, sind das 10 Pips. Bei Yen-Paaren ist ein Pip 0.01. Manche Broker zeigen auch einen Punkt oder eine Pipette an – das ist ein Zehntel eines Pips.","Aktien: Eine Aktie gewinnt oder verliert 1 Dollar pro 1 Dollar Bewegung. Krypto: Ein Coin funktioniert genauso pro Coin. Futures: Der kleinste Schritt heißt Tick, und jeder Kontrakt hat einen festen Dollar-Wert pro Tick."]},
         {"h":"Lot-Namen, entschlüsselt","p":["Im Forex ist ein Standard-Lot 100,000 Einheiten. Ein Mini-Lot sind 10,000. Ein Micro-Lot sind 1,000.","Also sind 0.10 Lots gleich 10,000 Einheiten, etwa 1 Dollar pro Pip. Und 0.01 Lots sind 1,000 Einheiten, etwa 10 Cent pro Pip."]},
         {"h":"Denk in Dollar pro Pip","p":["Die Buttons deines Brokers sagen Lots, aber dein Kopf sollte in Dollar pro Pip denken. Übersetze immer: Wie viele Dollar gewinne oder verliere ich pro Pip bei dieser Größe? Dann wird die Stop-Loss-Rechnung einfach."]}
       ],
       "workedExample":{"setup":"Du möchtest, dass jeder Pip etwa $1 wert ist.","steps":["Standard-Lot (1.00) ≈ $10/Pip.","0.10 Lots ≈ $1/Pip."],"answer":"0.10 Lots ≈ $1 pro Pip."},
       "tryIt":"Du tradest 0.01 Lots (Micro). Wie viel ist ein Pip ungefähr wert? ($0.10)",
       "script":"Lektion sechs. Pips, Punkte, Ticks und Kontrakte. Jeder Markt misst kleine Bewegungen anders. Im Forex ist der klassische Schritt der Pip. Bei den meisten Paaren ist ein Pip null Komma null null null eins. Bewegt sich Euro-Dollar von eins Komma null acht fünf null auf eins Komma null acht sechs null, sind das zehn Pips. Bei Yen-Paaren ist ein Pip null Komma null eins. Manche Broker zeigen auch einen Punkt oder eine Pipette an, ein Zehntel eines Pips. Bei Aktien gewinnt oder verliert eine Aktie einen Dollar pro Dollar Bewegung. Ganz einfach. Bei Krypto funktioniert ein Coin genauso. Bei Futures heißt der kleinste Schritt Tick, und jeder Kontrakt hat einen festen Dollar-Wert pro Tick. Jetzt die Lot-Namen: Im Forex ist ein Standard-Lot einhunderttausend Einheiten. Ein Mini-Lot sind zehntausend. Ein Micro-Lot sind eintausend. Also sind null Komma eins null Lots gleich zehntausend Einheiten, etwa ein Dollar pro Pip. Null Komma null eins Lots sind eintausend Einheiten, etwa zehn Cent pro Pip. Warum ist das wichtig? Weil die Buttons deines Brokers Lots sagen, dein Kopf aber in Dollar pro Pip denken sollte. Übersetze immer: Wie viele Dollar gewinne oder verliere ich pro Pip bei dieser Größe? Dann wird die Stop-Loss-Rechnung einfach."},
      "l07": {"title":"Gebühren: Die Kosten, die dir niemand zeigt","tagline":"Zähle die versteckten Kosten vor jedem Trade.","oneLiner":"Jeder Trade startet leicht im Minus: Spread, Kommission, Übernacht-Gebühren und Slippage gehen alle von deinem Gewinn ab.","formula":"Kosten hin und zurück ≈ Spread-Kosten + (Kommission × 2)",
       "sections":[
         {"h":"Jeder Trade startet im Minus","p":["Bevor sich der Preis zu deinen Gunsten bewegt, musst du zuerst deine Kosten wieder hereinholen. Es gibt vier Kosten, die du kennen musst.","Der Spread ist die Lücke zwischen Kauf- und Verkaufspreis. Du kaufst immer etwas teurer und verkaufst etwas billiger. Der Spread ist der Anteil des Brokers."]},
         {"h":"Die anderen drei Kosten","p":["Kommission: Manche Broker verlangen eine fixe Gebühr pro Trade, oft sowohl beim Öffnen als auch beim Schließen.","Übernacht-Gebühr, genannt Swap: Hältst du einen Forex- oder CFD-Trade über Nacht, zahlst oder erhältst du einen kleinen täglichen Zinsbetrag.","Slippage: Aus Lektion 1 – deine Ausführungen können in schnellen Märkten etwas schlechter sein als erwartet."]},
         {"h":"Rechne, bevor du klickst","p":["Beispiel: Du tradest 0.05 Lots EUR/USD. Der Spread beträgt 1.2 Pips. Ein Standard-Lot sind etwa 10 Dollar pro Pip. Spread-Kosten = 1.2 × 10 × 0.05 = 0.60 Dollar. Klein bei einem Trade, aber bei fünfzig Trades summiert es sich.","Die Gewohnheit: Frag dich vor jedem Trade, wie hoch die Kosten hin und zurück sind und ob dein Gewinnziel sie um ein Mehrfaches abdeckt. Fressen Gebühren mehr als etwa 10% deines Zielgewinns, ist der Trade vermutlich nichts wert."]}
       ],
       "workedExample":{"setup":"0.05 Lots EUR/USD. Spread 1.2 Pips. Standard-Lot ≈ $10/Pip.","steps":["Kosten = 1.2 × 10 × 0.05 = $0.60."],"answer":"Der Spread kostet dich bei diesem Trade etwa $0.60."},
       "tryIt":"Spread 2 Pips, 0.10 Lots. Kosten = 2 × 10 × 0.10 = $2 pro Trade hin und zurück.",
       "script":"Lektion sieben. Gebühren – die Kosten, die dir niemand zeigt. Jeder Trade startet leicht im Minus. Bevor sich der Preis zu deinen Gunsten bewegt, musst du zuerst deine Kosten wieder hereinholen. Es gibt vier Kosten, die du kennen musst. Erstens der Spread: die Lücke zwischen Kauf- und Verkaufspreis. Du kaufst immer etwas teurer und verkaufst etwas billiger. Der Spread ist der Anteil des Brokers. Zweitens die Kommission: Manche Broker verlangen eine fixe Gebühr pro Trade, oft beim Öffnen und beim Schließen. Drittens die Übernacht-Gebühr, genannt Swap: Hältst du einen Forex- oder CFD-Trade über Nacht, zahlst oder erhältst du einen kleinen täglichen Zinsbetrag. Viertens Slippage, aus Lektion eins: Deine Ausführungen können in schnellen Märkten etwas schlechter sein als erwartet. Rechnen wir: Du tradest null Komma null fünf Lots Euro-Dollar. Der Spread beträgt eins Komma zwei Pips. Ein Standard-Lot sind etwa zehn Dollar pro Pip. Spread-Kosten gleich eins Komma zwei mal zehn mal null Komma null fünf. Das sind sechzig Cent. Klein bei einem Trade, aber bei fünfzig Trades summiert es sich. Die Gewohnheit: Frag dich vor jedem Trade, wie hoch meine Kosten hin und zurück sind und ob mein Gewinnziel sie um ein Mehrfaches abdeckt. Fressen Gebühren mehr als etwa zehn Prozent deines Zielgewinns, ist der Trade vermutlich nichts wert."},
      "l08": {"title":"Chance-Risiko-Verhältnis: Lohnt sich der Trade?","tagline":"Das Verhältnis, mit dem du 6 von 10 Trades verlieren und trotzdem gewinnen kannst.","oneLiner":"Das Chance-Risiko-Verhältnis sagt dir, ob sich ein Trade lohnt: Ziele auf mindestens 1:2, dann darfst du meistens falsch liegen und trotzdem gewinnen.","formula":"Chance-Risiko = Gewinnabstand ÷ Risikoabstand · Break-even-Trefferquote = 1 ÷ (1 + R)",
       "sections":[
         {"h":"Lohnt sich dieser Trade überhaupt?","p":["Das Chance-Risiko-Verhältnis beantwortet eine Frage: Für jeden Dollar, den ich riskiere, wie viele Dollar kann ich verdienen?","Gewinnabstand ÷ Risikoabstand. Kauf EUR/USD bei 1.0850, Stopp bei 1.0830 (20 Pips Risiko), Ziel bei 1.0890 (40 Pips Gewinn). 40 ÷ 20 = 2. Das ist ein Chance-Risiko-Verhältnis von 1 zu 2."]},
         {"h":"Die Magie: Du darfst meistens falsch liegen","p":["Bei einem Verhältnis von 1 zu 2 musst du nur etwa 33% deiner Trades gewinnen, um bei null herauszukommen. Die Rechnung: Break-even-Trefferquote = 1 ÷ (1 + R). Also 1 ÷ 3 = 33%.","Gewinnst du 4 von 10 Trades bei 1 zu 2, bist du im Plus. Darum sind Profis von dieser Zahl besessen. Sie befreit dich davon, immer recht haben zu müssen."]},
         {"h":"Die Faustregel","p":["Nimm nie einen Trade unter 1 zu 1.5, und bevorzuge 1 zu 2 oder besser. Ein Trade mit tollem Setup, aber einem Verhältnis von 1 zu 1, ist ein Münzwurf mit Gebühren. Lass ihn aus."]}
       ],
       "workedExample":{"setup":"Risiko 20 Pips (1.0850 → 1.0830). Ziel 40 Pips (→ 1.0890).","steps":["Chance-Risiko = 40 ÷ 20 = 2.","Break-even-Trefferquote = 1 ÷ (1+2) = 33%."],"answer":"Ein 1:2-Trade. Du kannst nur 4 von 10 gewinnen und trotzdem profitieren."},
       "tryIt":"Risiko $3 pro Aktie, Ziel $9 über dem Einstieg. Chance-Risiko = 9 ÷ 3 = 1:3. Nimm ihn!",
       "script":"Lektion acht. Chance-Risiko-Verhältnis. Nicht jeder Trade ist es wert, genommen zu werden – selbst mit perfektem Stop-Loss. Das Chance-Risiko-Verhältnis beantwortet eine Frage: Für jeden Dollar, den ich riskiere, wie viele Dollar kann ich verdienen? Du findest es durch Dividieren: Gewinnabstand geteilt durch Risikoabstand. Beispiel: Du kaufst Euro-Dollar bei eins Komma null acht fünf null. Stopp bei eins Komma null acht drei null. Das sind zwanzig Pips Risiko. Dein Ziel ist eins Komma null acht neun null. Das sind vierzig Pips Gewinn. Vierzig geteilt durch zwanzig ist zwei. Ein Chance-Risiko-Verhältnis von eins zu zwei. Jetzt die Magie: Bei eins zu zwei musst du nur etwa dreiunddreißig Prozent deiner Trades gewinnen, um bei null herauszukommen. Die Rechnung: Break-even-Trefferquote gleich eins geteilt durch eins plus R. Eins geteilt durch drei sind dreiunddreißig Prozent. Gewinnst du vier von zehn Trades bei eins zu zwei, bist du im Plus. Darum sind Profis von dieser Zahl besessen. Sie befreit dich davon, immer recht haben zu müssen. Die Faustregel: Nimm nie einen Trade unter eins zu eins Komma fünf, und bevorzuge eins zu zwei oder besser. Ein Trade mit tollem Setup, aber einem Verhältnis von eins zu eins, ist ein Münzwurf mit Gebühren. Lass ihn aus."},
      "l09": {"title":"Trailing-Stops und der Weg zur Gewinnschwelle","tagline":"Sichere Gewinne, während der Trade noch läuft.","oneLiner":"Läuft ein Trade für dich, verschiebe deinen Stopp, sodass der schlimmste Fall die Gewinnschwelle ist.","formula":"Break-even-Stopp: Stopp auf den Einstieg verschieben, sobald der Trade +1R im Plus ist",
       "sections":[
         {"h":"Mach aus Gewinnern Gratis-Trades","p":["Dein Trade läuft um 1 R zu deinen Gunsten – er hat also so viel gewonnen, wie du riskiert hast. Jetzt verschiebst du deinen Stop-Loss auf deinen Einstiegspreis.","Der schlimmste Fall ist jetzt null, ein Null-Trade, statt eines vollen Verlusts. Dein Risiko ist verschwunden, aber deine Gewinnchance bleibt offen."]},
         {"h":"Ein durchgerechnetes Beispiel","p":["Du kaufst eine Aktie für 50 Dollar, Stopp bei 48. Der Preis steigt auf 54. Das sind 2 R Gewinn. Du verschiebst deinen Stopp von 48 auf 50.","Kehrt der Preis um, steigst du bei 50 ohne Verlust aus. Steigt er weiter, fährst du mit."]},
         {"h":"Trailing-Stops machen es automatisch","p":["Ein Trailing-Stopp folgt dem Preis in festem Abstand. Steigt der Preis, kriecht der Stopp hinterher. Fällt der Preis, bleibt der Stopp stehen, und irgendwann berührt der Preis ihn und du steigst mit gesichertem Gewinn aus.","Beispiel: Kauf bei 50, Trailing-Stopp von 2 Dollar. Der Preis erreicht 56, also liegt dein Stopp jetzt bei 54. Der Preis fällt auf 54, du bist raus – mit 4 Dollar pro Aktie gesichert."]},
         {"h":"Die goldene Regel beim Verschieben von Stopps","p":["Verschiebe deinen Stopp nie weiter weg, wenn ein Trade gegen dich läuft. Das verwandelt einen geplanten kleinen Verlust in Hoffnung. Stopps wandern nur in Richtung Gewinn, nie davon weg."]}
       ],
       "workedExample":{"setup":"Kauf bei $50, Trailing-Stopp $2. Der Preis steigt auf $56 und fällt dann.","steps":["Stopp folgt auf 56 − 2 = $54.","Preis berührt $54 → Ausstieg. Gewinn = 54 − 50 = $4 pro Aktie."],"answer":"Du steigst bei $54 aus, mit $4 pro Aktie gesichert."},
       "tryIt":"Kauf $50, Stopp $48. Preis erreicht $53 (+1.5R). Stopp auf $50 verschieben: Schlimmster Fall ist jetzt $0.",
       "script":"Lektion neun. Trailing-Stops und der Weg zur Gewinnschwelle. Ein Stop-Loss schützt dich vor großen Verlusten. Aber er kann auch deine Gewinner schützen. Hier ist der klassische Zug: Dein Trade läuft um ein R zu deinen Gunsten – er hat so viel gewonnen, wie du riskiert hast. Jetzt verschiebst du deinen Stop-Loss auf deinen Einstiegspreis. Der schlimmste Fall ist jetzt null, ein Null-Trade, statt eines vollen Verlusts. Dein Risiko ist einfach verschwunden. Beispiel: Du kaufst eine Aktie für fünfzig Dollar, Stopp bei achtundvierzig. Der Preis steigt auf vierundfünfzig. Das sind zwei R Gewinn. Du verschiebst deinen Stopp von achtundvierzig auf fünfzig. Kehrt der Preis um, steigst du bei fünfzig aus, ohne Verlust. Steigt er weiter, fährst du mit. Ein Trailing-Stopp automatisiert diese Idee: Er folgt dem Preis in festem Abstand. Steigt der Preis, kriecht der Stopp hinterher. Fällt der Preis, bleibt der Stopp stehen, und irgendwann berührt der Preis ihn und du steigst mit gesichertem Gewinn aus. Beispiel: Kauf bei fünfzig, Trailing-Stopp von zwei Dollar. Der Preis erreicht sechsundfünfzig. Dein Stopp liegt jetzt bei vierundfünfzig. Der Preis fällt auf vierundfünfzig, du bist raus, mit vier Dollar pro Aktie gesichert. Eine Warnung: Verschiebe deinen Stopp nie weiter weg, wenn ein Trade gegen dich läuft. Das verwandelt einen geplanten kleinen Verlust in Hoffnung. Stopps wandern nur in Richtung Gewinn, nie davon weg."},
      "l10": {"title":"Setz nicht zweimal alles auf eine Karte: korreliertes Risiko","tagline":"Fünf 1-%-Trades können heimlich ein einziges 5-%-Spiel sein.","oneLiner":"Korrelierte Trades vervielfachen dein Risiko. Zähle das gesamte offene Risiko, nicht nur das Risiko pro Trade.","formula":"Gesamte Hitze = Summe der Risiko-% aller offenen Trades (bei ≤ 3–6% halten)",
       "sections":[
         {"h":"Fünf sichere Trades können eine gefährliche Wette sein","p":["Die 1-%-Regel schützt jeden einzelnen Trade. Aber bei fünf gleichzeitig offenen Trades heißt dein gesamtes offenes Risiko „Hitze“ – und sie kann dich verbrennen.","Die Falle ist die Korrelation. Zwei Trades können heimlich dieselbe Wette sein. Long EUR/USD und long GBP/USD heißt im Grunde zweimal zu wetten, dass der Dollar fällt. Schießt der Dollar nach oben, werden beide Stopps am selben Tag getroffen. Das sind nicht zwei getrennte 1-%-Risiken. Das ist ein 2-%-Risiko in Verkleidung."]},
         {"h":"Die Lösung: Addiere alles","p":["Addiere das Risiko jedes offenen Trades. Diese Summe ist deine Hitze. Halte sie unter etwa 3 bis 6% deines Kontos.","Beispiel: drei Trades mit je 1.5% Risiko. Gesamte Hitze: 4.5%. Sind alle drei Dollar-Trades, ist das zu heiß. Schließe einen oder verkleinere die Positionen."]},
         {"h":"Die zwei Fragen vor jedem Trade","p":["Wie hoch ist meine gesamte Hitze gerade? Und wettet dieser Trade auf dasselbe wie etwas, das ich schon habe? Wenn ja, dimensioniere ihn als einen kombinierten Trade, nicht als zwei getrennte."]}
       ],
       "workedExample":{"setup":"Drei Trades mit je 1.5% Risiko, alle long gegen den USD.","steps":["Gesamte Hitze = 1.5 + 1.5 + 1.5 = 4.5%.","Alle drei hängen davon ab, dass der Dollar fällt → eine kombinierte Wette."],"answer":"4.5% gesamte Hitze auf ein Thema – zu heiß. Größe reduzieren oder einen Trade streichen."},
       "tryIt":"4 Trades × 1% Risiko, alle auf USD-Paaren. Gesamte Hitze = 4% auf ein Thema – zu heiß. Auf 2–3% kürzen.",
       "script":"Lektion zehn. Setz nicht zweimal alles auf eine Karte. Die Ein-Prozent-Regel schützt jeden einzelnen Trade. Aber was, wenn du fünf Trades gleichzeitig offen hast? Dein gesamtes offenes Risiko heißt Hitze, und sie kann dich verbrennen, selbst wenn jeder Trade der Ein-Prozent-Regel folgt. Die Falle ist die Korrelation: Zwei Trades können heimlich dieselbe Wette sein. Bist du long Euro-Dollar und long Pfund-Dollar, wettest du im Grunde zweimal darauf, dass der Dollar fällt. Schießt der Dollar nach oben, werden beide Stopps am selben Tag getroffen. Das sind nicht zwei getrennte Ein-Prozent-Risiken. Das ist ein Zwei-Prozent-Risiko in Verkleidung. Die Lösung ist einfach: Addiere das Risiko jedes offenen Trades. Diese Summe ist deine Hitze. Halte sie unter etwa drei bis sechs Prozent deines Kontos. Beispiel: Du hast drei Trades mit je eineinhalb Prozent Risiko. Gesamte Hitze: viereinhalb Prozent. Sind alle drei Dollar-Trades, ist das zu heiß. Schließe einen oder verkleinere die Positionen. Die Gewohnheit: Frag dich vor jedem neuen Trade zwei Dinge. Wie hoch ist meine gesamte Hitze gerade? Und wettet dieser Trade auf dasselbe wie etwas, das ich schon habe? Wenn die zweite Antwort ja ist, dimensioniere ihn als einen kombinierten Trade, nicht als zwei getrennte."},
      "l11": {"title":"Erwartungswert: Gewinnst du wirklich?","tagline":"Eine Zahl, die Können von Glück trennt.","oneLiner":"Der Erwartungswert sagt dir in einfacher Mathematik, ob deine Strategie über viele Trades wirklich Geld verdient.","formula":"Erwartungswert = (Trefferquote × Ø Gewinn) − (Verlustquote × Ø Verlust)",
       "sections":[
         {"h":"Glück oder Können? Eine Zahl antwortet","p":["Erwartungswert = (Trefferquote × durchschnittlicher Gewinn) − (Verlustquote × durchschnittlicher Verlust). Miss Gewinne und Verluste in R, aus Lektion 8.","Er sagt dir, was dir jeder Trade im Durchschnitt bringt. Positiv heißt: Die Strategie verdient mit der Zeit Geld. Negativ heißt: Sie verliert Geld, egal wie gut sich einzelne Trades anfühlen."]},
         {"h":"Ein durchgerechnetes Beispiel","p":["Du gewinnst 40% der Trades. Durchschnittlicher Gewinn: +2 R. Durchschnittlicher Verlust: −1 R.","Erwartungswert = (0.40 × 2) − (0.60 × 1) = 0.8 − 0.6 = +0.2 R pro Trade. Bei 1% Risiko pro Trade sind das +0.2% pro Trade. Über 100 Trades erwarte grob +20%."]},
         {"h":"Zwei Regeln, damit du ihm trauen kannst","p":["Du brauchst mindestens 30 Trades, idealerweise 50, bevor die Zahl etwas bedeutet. Zehn Trades sind nur Rauschen.","Schreibe jeden Trade in ein Tagebuch: Einstieg, Stopp, Ziel, Größe und das R-Ergebnis. Dein Tagebuch ist das Rohmaterial. Ohne es ist der Erwartungswert ein Ratespiel – und Raten ist teuer."]}
       ],
       "workedExample":{"setup":"40% Trefferquote. Ø Gewinn +2 R, Ø Verlust −1 R.","steps":["Gewinne: 0.40 × 2 = 0.8.","Verluste: 0.60 × 1 = 0.6.","Erwartungswert = 0.8 − 0.6 = +0.2 R."],"answer":"+0.2 R pro Trade. Die Strategie ist profitabel."},
       "tryIt":"50% Gewinne, Ø Gewinn +1.5R, Ø Verlust −1R. Erwartungswert = (0.5×1.5) − (0.5×1) = +0.25R. Profitabel!",
       "script":"Lektion elf. Erwartungswert. Die Frage, die jede Traderin und jeder Trader beantworten muss: Bin ich wirklich gut darin, oder hatte ich in letzter Zeit nur Glück? Der Erwartungswert gibt dir die ehrliche Antwort in einer Zahl. Die Formel: Erwartungswert gleich Trefferquote mal durchschnittlicher Gewinn, minus Verlustquote mal durchschnittlicher Verlust. Miss Gewinne und Verluste in R, aus Lektion acht. Beispiel: Du gewinnst vierzig Prozent deiner Trades. Dein durchschnittlicher Gewinn ist plus zwei R. Dein durchschnittlicher Verlust ist minus ein R. Erwartungswert gleich null Komma vier mal zwei, minus null Komma sechs mal eins. Das ist null Komma acht minus null Komma sechs, also plus null Komma zwei R. Jeder Trade bringt dir im Durchschnitt null Komma zwei R. Bei einem Prozent Risiko pro Trade sind das null Komma zwei Prozent pro Trade. Bei einhundert Trades erwarte etwa zwanzig Prozent Wachstum. Ist der Erwartungswert negativ, rettet keine Einstellung der Welt die Strategie. Repariere die Strategie oder höre auf, sie zu traden. Zwei Regeln: Erstens brauchst du mindestens dreißig Trades, idealerweise fünfzig, bevor die Zahl etwas bedeutet. Zehn Trades sind nur Rauschen. Zweitens: Schreibe jeden Trade in ein Tagebuch. Einstieg, Stopp, Ziel, Größe und das R-Ergebnis. Dein Tagebuch ist das Rohmaterial. Ohne es ist der Erwartungswert ein Ratespiel – und Raten ist teuer."},
      "l12": {"title":"TradingView: Das Wichtigste","tagline":"Zeichne den Trade, lies das Verhältnis, setze den Alarm, übe mit Spielgeld.","oneLiner":"Das Positions-Werkzeug von TradingView zeichnet dein Risiko und deinen Gewinn in den Chart und rechnet das Verhältnis für dich aus.","formula":"Nutze das Long-/Short-Positions-Werkzeug, um Risiko, Gewinn und Chance-Risiko vor dem Einstieg zu sehen",
       "sections":[
         {"h":"Zeichne deinen Trade, bevor du ihn nimmst","p":["In der linken Werkzeugleiste findest du das Werkzeug „Long-Position“ (Alt+L unter Windows, Option+L am Mac). Daneben liegt das Werkzeug „Short-Position“.","Klicke auf deinen Einstiegspreis und ziehe dann nach unten zu deinem Stopp. Ein rotes Feld erscheint: deine Risikozone. Ziehe nach oben zu deinem Ziel. Ein blaues Feld erscheint: deine Gewinnzone."]},
         {"h":"Lies das Etikett, vertrau der Mathematik","p":["Das Etikett des Werkzeugs zeigt automatisch den Stoppabstand, den Zielabstand und das Chance-Risiko-Verhältnis. Steht dort 1 zu 1, ziehe das Ziel weiter weg oder suche einen besseren Trade.","Lies den Stoppabstand aus dem Werkzeug ab, öffne den Lot-Größen-Rechner aus Stufe 2 und hole dir deine exakte Größe. Kein Raten."]},
         {"h":"Zwei starke Funktionen","p":["Alarme: Klicke mit der rechten Maustaste auf deine Stopplinie, wähle „Alarm hinzufügen“ und stelle ihn so ein, dass er auslöst, wenn der Preis die Linie kreuzt. Dein Handy sagt dir Bescheid, sobald ein Trade geschlossen wird.","Üben mit Spielgeld: Eröffne in TradingView ein Paper-Trading-Konto und nutze die Balken-Wiedergabe (Bar Replay) in der unteren Werkzeugleiste, um jeden Chart zurückzuspulen und Kerze für Kerze zu traden – genau wie der Simulator in dieser App, aber mit echter Historie."]}
       ],
       "workedExample":{"setup":"Einstieg 1.0850, Stopp 1.0830, Ziel 1.0890 bei EUR/USD.","steps":["Einstieg → Stopp ziehen: rotes Feld, 20 Pips.","→ Ziel ziehen: blaues Feld, 40 Pips. Etikett zeigt 1:2."],"answer":"Das Werkzeug zeigt 20 Pips Risiko, 40 Pips Gewinn, Verhältnis 1:2 – ein gültiger Trade."},
       "tryIt":"Öffne TradingView, zeichne eine Long-Position in irgendeinen Chart und lies das Verhältnis auf dem Etikett ab. Ziele auf 1:2+.",
       "script":"Lektion zwölf. TradingView-Grundlagen. Du hast die Mathematik gelernt. Jetzt lassen wir TradingView das Zeichnen für dich übernehmen. Öffne einen beliebigen Chart. In der linken Werkzeugleiste findest du das Werkzeug Long-Position, oder drücke Alt plus L unter Windows, Option plus L am Mac. Daneben liegt ein Short-Positions-Werkzeug. Klicke auf deinen Einstiegspreis und ziehe dann nach unten zu deinem Stopp. Ein rotes Feld erscheint: deine Risikozone. Ziehe jetzt nach oben zu deinem Ziel. Ein blaues Feld erscheint: deine Gewinnzone. Schau auf das Etikett am Feld. TradingView zeigt dir automatisch den Stoppabstand, den Zielabstand und das Chance-Risiko-Verhältnis. Steht dort eins zu eins, ziehe das Ziel weiter weg oder suche einen besseren Trade. Als Nächstes lies den Stoppabstand aus dem Werkzeug ab, öffne den Lot-Größen-Rechner aus Stufe zwei und hole dir deine exakte Größe. Kein Raten. Zwei starke Funktionen: Erstens Alarme. Klicke mit der rechten Maustaste auf deine Stopplinie, wähle Alarm hinzufügen und stelle ihn so ein, dass er auslöst, wenn der Preis die Linie kreuzt. Dein Handy sagt dir Bescheid, sobald ein Trade geschlossen wird. Zweitens: Üben mit Spielgeld. Eröffne in TradingView ein Paper-Trading-Konto und nutze die Balken-Wiedergabe in der unteren Werkzeugleiste, um jeden Chart zurückzuspulen und Kerze für Kerze zu traden – genau wie der Simulator in dieser App, aber mit echter Historie. Glückwunsch! Du weißt jetzt, was die meisten Trader nie lernen: Schütze die Unterseite mit Stopps, dimensioniere mit Mathematik, zähle die Gebühren und lass Gewinner laufen. Übe weiter, und der Markt bezahlt deine Ausbildung in kleinen, leistbaren Lektionen."}
    };

    /* ============ state ============ */
    var LS_KEY = "stoploss-lab-progress-v1";
    var LANG_KEY = "stoploss-lab-lang-v1";
    var LANG = "de";
    try{ var savedLang = localStorage.getItem(LANG_KEY); if(savedLang === "en" || savedLang === "de") LANG = savedLang; }catch(e){}
    function defaultState(){ return {lessons:{}, quizzes:{}, journal:[], simStats:{trades:0,wins:0,totalR:0}}; }
    var state = defaultState();
    try{
      var saved = localStorage.getItem(LS_KEY);
      if(saved){ var parsed = JSON.parse(saved); state = Object.assign(defaultState(), parsed); state.simStats = Object.assign({trades:0,wins:0,totalR:0}, parsed.simStats||{}); }
    }catch(e){}
    function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} updateTopProgress(); }

    /* ============ helpers ============ */
    function $(sel, root){ return (root||document).querySelector(sel); }
    function el(html){ var d=document.createElement("div"); d.innerHTML=html; return d.firstElementChild; }
    function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
    function money(n){ var sign = n<0?"-$":"$"; var a=Math.abs(n); return sign + a.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}); }
    function trimNum(n, d){ return Number(n.toFixed(d===undefined?4:d)).toLocaleString("en-US",{maximumFractionDigits:d===undefined?4:d}); }
    function levelById(id){ for(var i=0;i<LEVELS.length;i++) if(LEVELS[i].id===id) return LEVELS[i]; return null; }
    function lessonById(id){ for(var i=0;i<LESSONS.length;i++) if(LESSONS[i].id===id) return LESSONS[i]; return null; }
    function lessonsOf(levelId){ return LESSONS.filter(function(l){ return l.level===levelId; }); }
    function locLevel(lv){ if(LANG==="de" && lv && LEVELS_DE[lv.id]){ var o={}; for(var k in lv) o[k]=lv[k]; for(var k2 in LEVELS_DE[lv.id]) o[k2]=LEVELS_DE[lv.id][k2]; return o; } return lv; }
    function locLesson(l){ if(LANG==="de" && l && LESSONS_DE[l.id]){ var o={}; for(var k in l) o[k]=l[k]; for(var k2 in LESSONS_DE[l.id]) o[k2]=LESSONS_DE[l.id][k2]; return o; } return l; }
    function quizOf(levelId){ return (LANG==="de" && QUIZZES_DE[levelId]) ? QUIZZES_DE[levelId] : QUIZZES[levelId]; }
    function guideSteps(){ return LANG==="de" ? GUIDE_DE : GUIDE; }
    function isUnlocked(levelId){
      if(levelId==="novice") return true;
      if(levelId==="builder") return !!(state.quizzes.novice && state.quizzes.novice.passed);
      if(levelId==="pro") return !!(state.quizzes.builder && state.quizzes.builder.passed);
      return false;
    }
    function lessonsDoneCount(levelId){
      return lessonsOf(levelId).filter(function(l){ return state.lessons[l.id]; }).length;
    }
    function updateTopProgress(){
      var done = LESSONS.filter(function(l){ return state.lessons[l.id]; }).length;
      var t = $("#topprogress"); if(t) t.textContent = T().topProgress(done);
    }

    /* ============ navigation ============ */
    var currentView = "home";
    function show(view){
      currentView = view;
      document.querySelectorAll(".view").forEach(function(v){ v.classList.remove("active"); });
      var target = $("#view-"+view); if(target) target.classList.add("active");
      document.querySelectorAll(".tab").forEach(function(t){ t.classList.toggle("active", t.getAttribute("data-view")===view); });
      window.scrollTo(0,0);
      if(view==="home") renderHome();
      if(view==="learn") renderLearn();
      if(view==="calc") renderCalc();
      if(view==="sim") renderSim();
      if(view==="guide") renderGuide();
      if(view==="progress") renderProgress();
    }
    document.querySelectorAll(".tab").forEach(function(t){
      t.addEventListener("click", function(){ show(t.getAttribute("data-view")); });
    });

    /* ============ language toggle ============ */
    function applyLanguage(){
      var s = T();
      document.documentElement.lang = LANG === "de" ? "de-AT" : "en";
      var bt = $("#brand-tagline"); if(bt) bt.textContent = s.tagline;
      document.querySelectorAll(".lang-toggle button").forEach(function(b){
        b.classList.toggle("active", b.getAttribute("data-lang") === LANG);
      });
      var labels = [s.tabHome, s.tabLearn, s.tabTools, s.tabPractice, s.tabGuide, s.tabProgress];
      document.querySelectorAll(".tab .tab-label").forEach(function(sp, i){ if(labels[i]) sp.textContent = labels[i]; });
      updateTopProgress();
      var vc = $("#view-calc");
      if(vc && vc.dataset.built && vc.dataset.built !== LANG){ delete vc.dataset.built; vc.innerHTML = ""; }
      var vs = $("#view-sim");
      if(vs && vs.dataset.built && vs.dataset.built !== LANG){ stopSimTimer(); if(sim) sim.running = false; delete vs.dataset.built; vs.innerHTML = ""; }
      if(currentView === "lesson" && currentLesson){ openLesson(currentLesson); }
      else if(currentView === "quiz" && quizState){ renderQuiz(); }
      else { show(currentView); }
    }
    document.querySelectorAll(".lang-toggle button").forEach(function(b){
      b.addEventListener("click", function(){
        var nl = b.getAttribute("data-lang");
        if(nl === LANG) return;
        LANG = nl;
        try{ localStorage.setItem(LANG_KEY, LANG); }catch(e){}
        applyLanguage();
      });
    });

    /* ============ home ============ */
    function renderHome(){
      var v = $("#view-home");
      var s = T();
      var html = "";
      html += '<div class="hero"><p class="kicker">'+s.homeKicker+'</p>';
      html += '<h2>'+s.homeTitleHtml+'</h2>';
      html += '<p class="lead">'+esc(s.homeLead)+'</p></div>';

      html += '<div class="howitworks">';
      html += '<div class="how"><div class="stepno">1</div><div><h3>'+s.how1t+'</h3><p>'+esc(s.how1p)+'</p></div></div>';
      html += '<div class="how"><div class="stepno">2</div><div><h3>'+s.how2t+'</h3><p>'+esc(s.how2p)+'</p></div></div>';
      html += '<div class="how"><div class="stepno">3</div><div><h3>'+s.how3t+'</h3><p>'+esc(s.how3p)+'</p></div></div>';
      html += '</div>';

      html += '<p class="kicker" style="margin-bottom:12px;">'+s.roadmapKicker+'</p><div class="roadmap">';
      LEVELS.forEach(function(lvRaw){
        var lv = locLevel(lvRaw);
        var unlocked = isUnlocked(lv.id);
        var done = lessonsDoneCount(lv.id);
        var total = lessonsOf(lv.id).length;
        var quiz = state.quizzes[lv.id];
        var pct = Math.round(done/total*100);
        var chip = !unlocked ? '<span class="status-chip chip-lock">'+s.chipLocked+'</span>'
          : (quiz && quiz.passed) ? '<span class="status-chip chip-done">'+s.chipPassed+'</span>'
          : '<span class="status-chip chip-open">'+s.chipOpen+'</span>';
        html += '<article class="card levelcard'+(unlocked?"":" locked")+'">';
        html += '<span class="lvl-badge">'+esc(lv.name.split("·")[0].trim())+'</span>';
        html += '<h3>'+esc(lv.name)+'</h3>';
        html += '<p>'+esc(lv.tagline)+'</p>';
        html += '<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div>';
        html += '<div class="meta"><span class="small muted">'+s.lessonsOfTotal(done, total)+'</span>'+chip+'</div>';
        if(unlocked){
          html += '<button class="btn" data-goto-level="'+lv.id+'">'+s.startLearning+'</button>';
        } else {
          var prevShort = locLevel(levelById(lv.id==="builder" ? "novice" : "builder")).name.split("·")[0].trim();
          html += '<p class="locknote"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>'+esc(s.lockNote(prevShort))+'</p>';
        }
        html += '</article>';
      });
      html += '</div>';

      html += '<div class="card" style="margin-top:22px;"><h3 style="margin-bottom:6px;">'+s.tvCardTitle+'</h3>';
      html += '<p class="muted" style="margin:0 0 14px;">'+esc(s.tvCardText)+'</p>';
      html += '<button class="btn secondary" data-goto="guide">'+s.tvCardBtn+'</button></div>';

      v.innerHTML = html;
      v.querySelectorAll("[data-goto-level]").forEach(function(b){
        b.addEventListener("click", function(){ show("learn"); });
      });
      v.querySelectorAll("[data-goto]").forEach(function(b){
        b.addEventListener("click", function(){ show(b.getAttribute("data-goto")); });
      });
    }

    /* ============ learn ============ */
    function renderLearn(){
      var v = $("#view-learn");
      var s = T();
      var html = '<p class="kicker">'+s.learnKicker+'</p><h2 style="font-size:1.6rem;margin:4px 0 8px;">'+s.learnTitle+'</h2>';
      html += '<p class="lead">'+esc(s.learnLead)+'</p>';
      LEVELS.forEach(function(lvRaw, li){
        var lv = locLevel(lvRaw);
        var unlocked = isUnlocked(lv.id);
        var quiz = state.quizzes[lv.id];
        html += '<div class="levelblock">';
        html += '<div class="level-head"><h2>'+esc(lv.name)+'</h2><span class="tag">'+esc(lv.tagline)+'</span></div>';
        if(!unlocked){
          var prevFull = locLevel(levelById(lv.id==="builder" ? "novice" : "builder")).name;
          html += '<div class="lockedbox">'+s.lockedBox(esc(prevFull))+'</div>';
        } else {
          html += '<div class="lessonlist">';
          lessonsOf(lv.id).forEach(function(lRaw, i){
            var l = locLesson(lRaw);
            var done = !!state.lessons[l.id];
            html += '<button class="lessonrow'+(done?" done":"")+'" data-lesson="'+l.id+'">'
              + '<span class="n">'+(done ? "✓" : (li*4+i+1))+'</span>'
              + '<span><h3>'+esc(l.title)+'</h3><p>'+esc(l.tagline)+'</p></span>'
              + '<span class="chev">›</span></button>';
          });
          html += '</div>';
          html += '<div class="card" style="margin-bottom:12px;"><p class="kicker" style="margin-bottom:6px;">'+s.watchKicker+'</p>'
            + '<h3 style="font-size:1.05rem;margin-bottom:4px;">'+esc(lv.videoTopic)+'</h3>'
            + '<div class="videobox"><video controls preload="metadata" src="assets/videos/'+lvRaw.video+'" onerror="videoFailed(this)"></video>'
            + '<div class="placeholder" style="display:none;">'+esc(s.videoPlaceholder)+'</div></div></div>';
          html += '<div class="card"><p class="kicker" style="margin-bottom:6px;">'+s.quizKicker+'</p>'
            + '<h3 style="font-size:1.05rem;margin-bottom:4px;">'+(quiz && quiz.passed ? s.quizPassedLabel : s.quizToPass)+'</h3>'
            + '<p class="muted small" style="margin:0 0 14px;">'+(quiz ? esc(s.quizBest(quiz.best)) : "")+esc(s.quizExplainNote)+'</p>'
            + '<button class="btn" data-quiz="'+lv.id+'">'+(quiz && quiz.passed ? s.retakeQuiz : s.takeQuiz)+'</button></div>';
        }
        html += '</div>';
      });
      v.innerHTML = html;
      v.querySelectorAll("[data-lesson]").forEach(function(b){
        b.addEventListener("click", function(){ openLesson(b.getAttribute("data-lesson")); });
      });
      v.querySelectorAll("[data-quiz]").forEach(function(b){
        b.addEventListener("click", function(){ startQuiz(b.getAttribute("data-quiz")); });
      });
    }
    function videoFailed(vid){
      vid.style.display = "none";
      var ph = vid.parentElement.querySelector(".placeholder");
      if(ph) ph.style.display = "block";
    }

    /* ============ lesson page ============ */
    var currentLesson = null;
    function openLesson(id){
      currentLesson = id;
      var lRaw = lessonById(id); if(!lRaw) return;
      var l = locLesson(lRaw);
      var s = T();
      var lv = locLevel(levelById(l.level));
      var idx = LESSONS.indexOf(lRaw);
      var prev = idx>0 ? LESSONS[idx-1] : null;
      var next = idx<LESSONS.length-1 ? LESSONS[idx+1] : null;
      var done = !!state.lessons[l.id];
      var audioSrc = LANG==="de" ? "assets/audio/de/lesson-"+l.id+".mp3" : "assets/audio/lesson-"+l.id+".mp3";
      var html = "";
      html += '<button class="backlink" data-back>'+s.lessonBack+'</button>';
      html += '<div class="lesson-hero"><p class="kicker">'+esc(lv.name)+'</p><h2>'+esc(l.title)+'</h2><p class="tagline">'+esc(l.tagline)+'</p></div>';

      html += '<div class="playerbox"><div class="plabel"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>'+s.listenLabel+'</div>'
        + '<audio controls preload="metadata" src="'+audioSrc+'" onerror="audioFailed(this)"></audio>'
        + '<p class="soon" style="display:none;">'+esc(s.audioSoon)+'</p>'
        + '<details class="transcript"><summary>'+s.transcriptSummary+'</summary><p>'+esc(l.script)+'</p></details></div>';

      html += '<div class="oneliner">'+esc(l.oneLiner)+'</div>';

      if(l.diagram){
        html += '<figure class="diagram" style="margin-left:0;margin-right:0;"><img src="assets/images/'+l.diagram+'" alt="'+esc(s.diagramAlt(l.title))+'" onerror="diagramFailed(this)"/>'
          + '<div class="placeholder" style="display:none;">'+esc(s.diagramPlaceholder)+'</div></figure>';
      }

      html += '<div class="lesson-body">';
      l.sections.forEach(function(s){
        html += '<h3>'+esc(s.h)+'</h3>';
        s.p.forEach(function(p){ html += '<p>'+esc(p)+'</p>'; });
      });
      html += '</div>';

      html += '<div class="formula">'+esc(l.formula)+'</div>';

      html += '<div class="worked"><h3>'+s.workedExample+'</h3><p class="setup">'+esc(l.workedExample.setup)+'</p><ol>';
      l.workedExample.steps.forEach(function(st){ html += '<li>'+esc(st)+'</li>'; });
      html += '</ol><div class="answer">'+esc(l.workedExample.answer)+'</div></div>';

    function paintAnswer(countScore){
      var s = T();
      var q = quizOf(quizState.levelId)[quizState.index];
      var i = quizState.picked;
      var correct = i === q.a;
      if(countScore && correct) quizState.score++;

    function newCandles(inst, count, startPrice){
      var candles = []; var price = startPrice;
      for(var i=0;i<count;i++){
        var open = price;
        var drift = (Math.random()-0.47) * inst.vol * 0.4;
        var close = open + drift + (Math.random()-0.5) * inst.vol * 1.6;
        var high = Math.max(open, close) + Math.random()*inst.vol*0.6;
        var low = Math.min(open, close) - Math.random()*inst.vol*0.6;
        candles.push({o:open,h:high,l:low,c:close});
        price = close;
      }
      return candles;
    }
    function nextCandle(inst, prevClose){
      var open = prevClose;
      var trend = sim && sim.trend ? sim.trend : 0;
      var close = open + trend + (Math.random()-0.5) * inst.vol * 1.7;
      var high = Math.max(open, close) + Math.random()*inst.vol*0.7;
      var low = Math.min(open, close) - Math.random()*inst.vol*0.7;
      return {o:open,h:high,l:low,c:close};
    }

      stopSimTimer();

      sim.candles = newCandles(inst, 42, inst.startPrice);
      var last = sim.candles[sim.candles.length-1].c;

      sim.target = last + inst.defaultStopPips * inst.pipSize * 2;

    function stopSimTimer(){ if(sim && sim.timer){ clearInterval(sim.timer); sim.timer = null; } }

    function chartGeom(){
      var canvas = $("#simchart"); if(!canvas) return null;
      var rect = canvas.getBoundingClientRect();
      var dpr = window.devicePixelRatio || 1;
      var W = Math.max(280, Math.floor(rect.width));
      var H = 320;
      if(canvas.width !== W*dpr || canvas.height !== H*dpr){ canvas.width = W*dpr; canvas.height = H*dpr; }
      var ctx = canvas.getContext("2d");
      ctx.setTransform(dpr,0,0,dpr,0,0);
      var prices = [];
      sim.candles.forEach(function(c){ prices.push(c.h, c.l); });
      [sim.entry, sim.stop, sim.target].forEach(function(p){ if(p!==null && p!==undefined) prices.push(p); });
      var hi = Math.max.apply(null, prices), lo = Math.min.apply(null, prices);
      var pad = (hi-lo)*0.12 || 1; hi += pad; lo -= pad;
      return {ctx:ctx, W:W, H:H, hi:hi, lo:lo,
        y:function(p){ return H - (p-lo)/(hi-lo)*H; },
        priceAt:function(y){ return lo + (H-y)/H*(hi-lo); }};
    }

    function drawSim(){
      var canvas = $("#simchart"); if(!canvas || !sim) return;
      var g = chartGeom(); if(!g) return;
      var ctx = g.ctx, inst = simInst();
      ctx.clearRect(0,0,g.W,g.H);
      ctx.fillStyle = "#101d33"; ctx.fillRect(0,0,g.W,g.H);
      ctx.strokeStyle = "rgba(246,239,221,.08)"; ctx.lineWidth = 1;
      for(var i=1;i<5;i++){ var gy = g.H*i/5; ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(g.W,gy); ctx.stroke(); }
      var n = sim.candles.length;
      var slot = g.W / Math.max(n, 30);
      var bw = Math.max(3, slot*0.6);
      sim.candles.forEach(function(c, i){
        var x = i*slot + slot/2;
        var up = c.c >= c.o;
        var col = up ? "#4db884" : "#e0655a";
        ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.moveTo(x, g.y(c.h)); ctx.lineTo(x, g.y(c.l)); ctx.stroke();
        var yO = g.y(c.o), yC = g.y(c.c);
        ctx.fillRect(x-bw/2, Math.min(yO,yC), bw, Math.max(2, Math.abs(yC-yO)));
      });
      function line(price, color, label){
        if(price===null || price===undefined) return;
        var y = g.y(price);
        ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.setLineDash(price===sim.entry?[]:[7,5]);
        ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(g.W,y); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = color;
        var text = label + " " + fmtPrice(inst, price);
        ctx.font = "bold 12px " + getComputedStyle(document.body).getPropertyValue("--font");
        var tw = ctx.measureText(text).width + 14;
        ctx.fillRect(g.W-tw-4, y-11, tw, 22);
        ctx.fillStyle = "#101d33"; ctx.fillText(text, g.W-tw+3, y+4);
      }
      line(sim.target, "#4db884", T().lineTarget);
      line(sim.stop, "#e0655a", T().lineStop);
      line(sim.entry, "#f0a84e", T().lineEntry);
    }

    function setupCanvas(){
      var canvas = $("#simchart");
      function pos(e){
        var rect = canvas.getBoundingClientRect();
        var y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
        return y;
      }
      function nearestLine(y){
        var g = chartGeom(); if(!g) return null;
        var best = null, bestD = 18;
        [["stop", sim.stop], ["target", sim.target]].forEach(function(pair){
          if(pair[1]===null || pair[1]===undefined) return;
          var d = Math.abs(g.y(pair[1]) - y);
          if(d < bestD){ bestD = d; best = pair[0]; }
        });
        return best;
      }
      function onDown(e){
        if(sim.running) return;
        var y = pos(e);
        var near = nearestLine(y);
        var g = chartGeom(); if(!g) return;
        if(near){ sim.dragTarget = near; }
        else {
          var last = sim.candles[sim.candles.length-1].c;
          var inst = simInst();
          sim.entry = last;
          sim.stop = last - inst.defaultStopPips * inst.pipSize;
          sim.target = last + inst.defaultStopPips * inst.pipSize * 2;
          sim.finished = false;
          setFeedback("info", T().fbEntrySet(fmtPrice(inst, last)));
        }
        drawSim(); updatePlan();
        e.preventDefault();
      }
      function onMove(e){
        if(!sim.dragTarget || sim.running) return;
        var g = chartGeom(); if(!g) return;
        var p = g.priceAt(pos(e));
        if(sim.dragTarget === "stop"){ sim.stop = Math.min(p, sim.entry - simInst().pipSize); }
        if(sim.dragTarget === "target"){ sim.target = Math.max(p, sim.entry + simInst().pipSize); }
        drawSim(); updatePlan();
        e.preventDefault();
      }
      function onUp(){ sim.dragTarget = null; }
      canvas.addEventListener("pointerdown", onDown);
      canvas.addEventListener("pointermove", onMove);
      window.addEventListener("pointerup", onUp);
      window.addEventListener("resize", function(){ drawSim(); });
    }

    function simFee(size){
      var inst = simInst();
      if(sim.instKey === "eurusd") return inst.spreadPips * inst.pipValuePerLot * size;
      return inst.spreadDollars * size;
    }
    function updatePlan(){
      var out = $("#s-plan"); if(!out || !sim) return;
      var inst = simInst();
      var acct = parseFloat($("#s-acct").value)||0;
      var riskPct = parseFloat($("#s-risk").value)||0;
      var riskDollars = acct * riskPct / 100;
      if(sim.entry===null || sim.stop===null || sim.target===null){
        out.innerHTML = '<p style="margin:0;">'+esc(T().planEmpty)+'</p>'; return;
      }
      var distPrice = Math.abs(sim.entry - sim.stop);
      var distUnits = distPrice / inst.pipSize;
      var size = distUnits>0 ? riskDollars / (distUnits * inst.pipValuePerLot) : 0;
      var gainPrice = Math.abs(sim.target - sim.entry);
      var gainUnits = gainPrice / inst.pipSize;
      var gainDollars = gainUnits * inst.pipValuePerLot * size;
      var fee = simFee(size);
      var rr = distPrice>0 ? gainPrice/distPrice : 0;
      sim.plan = {size:size, riskDollars:riskDollars, gainDollars:gainDollars, fee:fee, rr:rr};
      out.innerHTML = '<div class="statgrid" style="margin-top:0;">'
        + '<div class="stat"><div class="v">'+trimNum(size, sim.instKey==="eurusd"?2:3)+' '+simUnit()+'</div><div class="k">'+T().tradeSizeK+'</div></div>'
        + '<div class="stat"><div class="v">'+money(riskDollars)+'</div><div class="k">'+T().ifStopK+'</div></div>'
        + '<div class="stat"><div class="v">'+money(gainDollars)+'</div><div class="k">'+T().ifTargetK+'</div></div>'
        + '<div class="stat"><div class="v">1 : '+trimNum(rr,1)+'</div><div class="k">'+T().riskRewardK+'</div></div>'
        + '<div class="stat"><div class="v">'+money(fee)+'</div><div class="k">'+T().feeEstK+'</div></div></div>'
        + '<p class="sentence">'+T().planSentence(money(riskDollars + fee), money(gainDollars - fee))+'</p>';
    }

    function setFeedback(kind, text){
      var f = $("#s-feedback"); if(!f) return;
      f.className = "feedback show " + kind;
      f.textContent = text;
    }

    function runTrade(){
      if(sim.running) return;
      if(sim.entry===null){ setFeedback("info", T().fbTapFirst); return; }
      updatePlan();
      if(!sim.plan || sim.plan.size<=0){ setFeedback("info", T().fbCheckPlan); return; }
      sim.running = true; sim.finished = false;
      var inst = simInst();
      sim.trend = (Math.random()-0.46) * inst.vol * 0.5;
      var btn = $("#s-run"); btn.disabled = true; btn.textContent = T().runningTrade;
      setFeedback("info", T().fbLive);
      var ticks = 0;
      stopSimTimer();
      sim.timer = setInterval(function(){
        ticks++;
        var prev = sim.candles[sim.candles.length-1].c;
        var c = nextCandle(inst, prev);
        sim.candles.push(c);
        if(sim.candles.length > 90) sim.candles.shift();
        drawSim();
        var hitStop = c.l <= sim.stop;
        var hitTarget = c.h >= sim.target;
        if(hitStop || hitTarget || ticks >= 60){
          finishTrade(hitTarget && !hitStop ? "target" : (hitStop ? "stop" : "timeout"), c.c);
        }
      }, 320);
    }

    function finishTrade(how, lastPrice){
      stopSimTimer();
      sim.running = false; sim.finished = true;
      var btn = $("#s-run"); btn.disabled = false; btn.textContent = T().runTrade;
      var inst = simInst();
      var plan = sim.plan;
      var exitPrice = how==="target" ? sim.target : (how==="stop" ? sim.stop : lastPrice);
      var moveUnits = (exitPrice - sim.entry) / inst.pipSize;
      var gross = moveUnits * inst.pipValuePerLot * plan.size;
      var net = gross - plan.fee;
      var R = plan.riskDollars>0 ? net / plan.riskDollars : 0;
      var entry = {key: sim.instKey, inst: instName(sim.instKey), entry: sim.entry, stop: sim.stop, target: sim.target, size: plan.size, unit: simUnit(), exit: exitPrice, how: how, net: net, R: R};
      state.journal.unshift(entry);
      state.simStats.trades += 1;
      if(net > 0) state.simStats.wins += 1;
      state.simStats.totalR += R;
      save();
      renderJournal(); renderSimStats();
      if(how==="target"){
        setFeedback("win", T().fbWin(money(net), (R>=0?"+":"") + trimNum(R,2)));
      } else if(how==="stop"){
        setFeedback("lose", T().fbLose(money(Math.abs(net)), trimNum(R,2)));
      } else {
        setFeedback("info", T().fbTimeout(money(net), (R>=0?"+":"") + trimNum(R,2)));
      }
      drawSim();
    }

    function renderJournal(){
      var j = $("#s-journal"); if(!j) return;
      var s = T();
      if(!state.journal.length){
        j.innerHTML = '<div class="jrow muted">'+esc(s.journalEmpty)+'</div>'; return;
      }
      j.innerHTML = state.journal.slice(0, 20).map(function(t){
        var inst = null;
        Object.keys(INSTRUMENTS).forEach(function(k){ if(INSTRUMENTS[k].name===t.inst || INSTRUMENTS[k].nameDe===t.inst || k===t.key) inst = INSTRUMENTS[k]; });
        var d = inst ? inst.decimals : 2;
        var dispName = (t.key && INSTRUMENTS[t.key]) ? instName(t.key) : t.inst;
        var fp = function(p){ return p.toLocaleString("en-US",{minimumFractionDigits:d, maximumFractionDigits:d}); };
        var cls = t.net>0 ? "r-win" : "r-lose";
        return '<div class="jrow"><strong>'+esc(dispName)+'</strong>'
          + '<span>'+s.jEntry+' '+fp(t.entry)+'</span><span>'+s.jStop+' '+fp(t.stop)+'</span><span>'+s.jTarget+' '+fp(t.target)+'</span>'
          + '<span>'+s.jSize+' '+trimNum(t.size,3)+' '+esc(t.unit)+'</span>'
          + '<span>'+s.jClosedAt+' '+fp(t.exit)+' ('+(t.how==="target"?s.jTargetHit:(t.how==="stop"?s.jStoppedOut:s.jTimeOut))+')</span>'
          + '<span class="'+cls+'">'+(t.R>=0?"+":"")+trimNum(t.R,2)+'R · '+money(t.net)+'</span></div>';
      }).join("");
    }

    function renderSimStats(){
      var sEl = $("#s-stats"); if(!sEl) return;
      var s = T();
      var st = state.simStats;
      var winRate = st.trades ? Math.round(st.wins/st.trades*100) : 0;
      var avgR = st.trades ? st.totalR/st.trades : 0;
      sEl.innerHTML =
          '<div class="stat"><div class="v">'+st.trades+'</div><div class="k">'+s.statTrades+'</div></div>'
        + '<div class="stat"><div class="v">'+winRate+'%</div><div class="k">'+s.statWinRate+'</div></div>'
        + '<div class="stat"><div class="v">'+(avgR>=0?"+":"")+trimNum(avgR,2)+'R</div><div class="k">'+s.statAvgR+'</div></div>';
    }

    /* ============ guide ============ */
    function renderGuide(){
      var v = $("#view-guide");
      var s = T();
      var html = '<p class="kicker">'+s.guideKicker+'</p><h2 style="font-size:1.6rem;margin:4px 0 8px;">'+s.guideTitle+'</h2>';
      html += '<p class="lead">'+esc(s.guideLead)+'</p>';
      html += '<div class="card">';
      guideSteps().forEach(function(st, i){
        html += '<div class="gstep"><div class="gn">'+(i+1)+'</div><div><h3>'+esc(st.t)+'</h3><p>'+esc(st.d)+'</p></div></div>';
      });
      html += '<a class="btn" href="https://www.tradingview.com" target="_blank" rel="noopener" style="margin-top:8px;">'+s.openTV+'</a>';
      html += '<p class="small muted" style="margin:14px 0 0;">'+esc(s.guideTip)+'</p></div>';
      v.innerHTML = html;
    }

    /* ============ progress ============ */
    function renderProgress(){
      var v = $("#view-progress");
      var s = T();
      var done = LESSONS.filter(function(l){ return state.lessons[l.id]; }).length;
      var passed = LEVELS.filter(function(lv){ return state.quizzes[lv.id] && state.quizzes[lv.id].passed; }).length;
      var st = state.simStats;
      var winRate = st.trades ? Math.round(st.wins/st.trades*100) : 0;
      var avgR = st.trades ? st.totalR/st.trades : 0;
      var html = '<p class="kicker">'+s.progressKicker+'</p><h2 style="font-size:1.6rem;margin:4px 0 18px;">'+s.progressTitle+'</h2>';
      html += '<div class="calc-grid">';
      html += '<div class="card"><h3 style="margin-bottom:12px;">'+s.lessonsCardT+'</h3>'
        + '<div class="progress-track" style="margin-bottom:10px;"><div class="progress-fill" style="width:'+Math.round(done/12*100)+'%"></div></div>'
        + '<p style="margin:0;"><span class="big num" style="font-size:1.4rem;font-weight:900;">'+done+' / 12</span> <span class="muted">'+s.ofLessonsWord+'</span></p>';
      LEVELS.forEach(function(lvRaw){
        var lv = locLevel(lvRaw);
        html += '<p class="small" style="margin:8px 0 0;">'+esc(s.perLevelLine(lv.name, lessonsDoneCount(lv.id), lessonsOf(lv.id).length))+'</p>';
      });
      html += '</div>';
      html += '<div class="card"><h3 style="margin-bottom:12px;">'+s.quizzesCardT+'</h3>'
        + '<p style="margin:0 0 8px;"><span style="font-size:1.4rem;font-weight:900;" class="num">'+passed+' / 3</span> <span class="muted">'+s.ofQuizzesWord+'</span></p>';
      LEVELS.forEach(function(lvRaw){
        var lv = locLevel(lvRaw);
        var q = state.quizzes[lv.id];
        html += '<p class="small" style="margin:6px 0 0;">'+esc(lv.name)+': '+(q ? esc(s.quizLine(q.best, q.passed)) : esc(s.quizLineNone))+'</p>';
      });
      html += '</div>';
      html += '<div class="card wide"><h3 style="margin-bottom:12px;">'+s.practiceRecordT+'</h3><div class="statgrid" style="margin-top:0;">'
        + '<div class="stat"><div class="v">'+st.trades+'</div><div class="k">'+s.statTrades+'</div></div>'
        + '<div class="stat"><div class="v">'+winRate+'%</div><div class="k">'+s.statWinRate+'</div></div>'
        + '<div class="stat"><div class="v">'+(avgR>=0?"+":"")+trimNum(avgR,2)+'R</div><div class="k">'+s.statAvgR+'</div></div>'
        + '<div class="stat"><div class="v">'+state.journal.length+'</div><div class="k">'+s.statJournal+'</div></div></div>'
        + '<p class="small muted" style="margin:12px 0 0;">'+esc(s.progressNote)+'</p></div>';
      html += '</div>';
      html += '<div class="card" style="margin-top:18px;"><h3 style="margin-bottom:6px;">'+s.startOverT+'</h3>'
        + '<p class="muted small" style="margin:0 0 14px;">'+esc(s.startOverText)+'</p>'
        + '<button class="btn ghost" id="reset-progress">'+s.resetBtn+'</button> <span id="reset-note" class="small" style="font-weight:700;"></span></div>';
      v.innerHTML = html;
      var confirming = false;
      $("#reset-progress").addEventListener("click", function(){
        if(!confirming){
          confirming = true;
          this.textContent = T().resetConfirmBtn;
          $("#reset-note").textContent = T().resetUndoNote;
          return;
        }
        state = defaultState(); save();
        renderProgress(); updateTopProgress();
        $("#reset-note").textContent = T().resetDoneNote;
      });
    }

    /* ============ boot ============ */
    applyLanguage();
    </script>
  </body>
</html>
