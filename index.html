<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Stop-Loss Trading Lab</title>
    <style>
      :root{
        color-scheme: light dark;
        --bg:#f5f2ec;
        --bg-soft:#efe9dd;
        --panel:#fffdf8;
        --panel-2:#f3eee2;
        --ink:#17233c;
        --ink-soft:#4a5872;
        --ink-faint:#71809b;
        --line:#ddd3bf;
        --navy:#17233c;
        --navy-2:#22345a;
        --accent:#d97e21;
        --accent-strong:#b9610d;
        --accent-soft:#fbeed6;
        --green:#2e8b62;
        --green-soft:#e2f2e8;
        --red:#c8453c;
        --red-soft:#fbe7e4;
        --blue:#2f6fb2;
        --blue-soft:#e3eef8;
        --shadow:0 10px 30px rgba(23,35,60,.10);
        --radius:18px;
        --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
        --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
      }
      @media (prefers-color-scheme: dark){
        :root{
          --bg:#0b1322;
          --bg-soft:#0e1830;
          --panel:#14223d;
          --panel-2:#1a2c4c;
          --ink:#f2ecdd;
          --ink-soft:#c3cadd;
          --ink-faint:#93a0ba;
          --line:#2b3d61;
          --navy:#0b1322;
          --navy-2:#182a4b;
          --accent:#f0a84e;
          --accent-strong:#f5bd72;
          --accent-soft:#3a2c15;
          --green:#5cc492;
          --green-soft:#173629;
          --red:#f08a80;
          --red-soft:#3b211f;
          --blue:#7db3e8;
          --blue-soft:#1c2f4d;
          --shadow:0 10px 30px rgba(0,0,0,.35);
        }
      }
      *{box-sizing:border-box;}
      html{-webkit-text-size-adjust:100%;}
      body{
        margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);
        font-size:17px;line-height:1.55;padding-bottom:96px;
      }
      a{color:var(--blue);}
      button{font-family:inherit;}
      h1,h2,h3{line-height:1.2;margin:0;}
      .wrap{max-width:1100px;margin:0 auto;padding:0 18px;}

      /* ---------- top bar ---------- */
      .topbar{
        position:sticky;top:0;z-index:40;
        background:var(--navy);color:#f6efdd;
        border-bottom:3px solid var(--accent);
      }
      .topbar-in{max-width:1100px;margin:0 auto;padding:14px 18px 12px;display:flex;align-items:center;gap:14px;}
      .brandmark{flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:12px;background:var(--navy-2);border:1px solid rgba(246,239,221,.25);}
      .brand h1{font-size:1.28rem;letter-spacing:.2px;color:#fdf8ec;}
      .brand p{margin:2px 0 0;font-size:.86rem;color:#cdbd96;}
      .topbar .spacer{flex:1;}
      .pill-progress{display:none;font-size:.82rem;color:#f6efdd;background:var(--navy-2);border:1px solid rgba(246,239,221,.25);border-radius:999px;padding:6px 12px;white-space:nowrap;}
      @media (min-width:760px){.pill-progress{display:block;}}
      .lang-toggle{display:flex;flex:0 0 auto;background:var(--navy-2);border:1px solid rgba(246,239,221,.35);border-radius:999px;padding:3px;gap:3px;}
      .lang-toggle button{border:0;background:transparent;color:#cdbd96;font-weight:800;font-size:.88rem;padding:8px 15px;border-radius:999px;cursor:pointer;min-height:38px;letter-spacing:.03em;}
      .lang-toggle button.active{background:var(--accent);color:#23160a;}
      .lang-toggle button:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}

      /* ---------- tabs ---------- */
      .tabs{
        position:fixed;left:0;right:0;bottom:0;z-index:50;
        background:var(--panel);border-top:1px solid var(--line);
        padding:6px 4px calc(6px + env(safe-area-inset-bottom));
        box-shadow:0 -6px 24px rgba(23,35,60,.08);
      }
      .tabs-in{display:flex;width:100%;}
      .tab{
        flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
        background:none;border:0;color:var(--ink-faint);cursor:pointer;
        font-size:.72rem;font-weight:700;padding:8px 2px;border-radius:12px;min-height:56px;justify-content:center;
      }
      .tab svg{width:24px;height:24px;}
      .tab.active{color:var(--accent-strong);}
      .tab:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
      @media (min-width:760px){
        body{padding-bottom:0;}
        .tabs{position:sticky;top:66px;bottom:auto;box-shadow:none;border-top:0;border-bottom:1px solid var(--line);justify-content:flex-start;gap:6px;padding:8px 0;}
        .tabs-in{max-width:1100px;margin:0 auto;padding:0 18px;display:flex;gap:6px;width:100%;}
        .tab{flex:0 0 auto;flex-direction:row;gap:8px;font-size:.95rem;padding:10px 16px;min-height:44px;}
      }

      /* ---------- generic ---------- */
      main{padding:26px 0 40px;}
      .view{display:none;}
      .view.active{display:block;}
      .kicker{font-size:.8rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-strong);}
      .lead{font-size:1.06rem;color:var(--ink-soft);max-width:62ch;}
      .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);}
      .btn{
        display:inline-flex;align-items:center;justify-content:center;gap:8px;
        background:var(--accent);color:#23160a;border:0;border-radius:14px;
        font-size:1rem;font-weight:800;padding:14px 22px;cursor:pointer;min-height:52px;
        text-decoration:none;
      }
      .btn:hover{background:var(--accent-strong);color:#fff8ec;}
      .btn.secondary{background:var(--panel-2);color:var(--ink);border:1px solid var(--line);}
      .btn.secondary:hover{border-color:var(--accent);color:var(--accent-strong);}
      .btn.ghost{background:transparent;color:var(--accent-strong);border:2px solid var(--accent);}
      .btn:disabled{opacity:.45;cursor:not-allowed;}
      .btn:focus-visible,.opt:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
      .num{font-family:var(--mono);font-variant-numeric:tabular-nums;}
      .muted{color:var(--ink-soft);}
      .small{font-size:.88rem;}
      .backlink{background:none;border:0;color:var(--blue);font-size:1rem;font-weight:700;cursor:pointer;padding:8px 0;display:inline-flex;gap:6px;align-items:center;}

      /* ---------- home ---------- */
      .hero{padding:8px 0 4px;}
      .hero h2{font-size:2rem;font-weight:900;letter-spacing:-.01em;max-width:16ch;}
      .hero h2 span{color:var(--accent-strong);}
      .howitworks{display:grid;gap:12px;margin:22px 0 30px;}
      .how{display:flex;gap:14px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;}
      .how .stepno{flex:0 0 auto;width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent-strong);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.05rem;}
      .how h3{font-size:1.02rem;margin-bottom:2px;}
      .how p{margin:0;color:var(--ink-soft);font-size:.94rem;}
      @media (min-width:760px){.howitworks{grid-template-columns:repeat(3,1fr);}}
      .roadmap{display:grid;gap:16px;}
      @media (min-width:760px){.roadmap{grid-template-columns:repeat(3,1fr);}}
      .levelcard{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:8px;}
      .levelcard .lvl-badge{font-size:.78rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-strong);}
      .levelcard h3{font-size:1.25rem;}
      .levelcard p{margin:0;color:var(--ink-soft);font-size:.95rem;}
      .levelcard .meta{margin-top:auto;padding-top:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
      .progress-track{height:8px;background:var(--panel-2);border-radius:99px;overflow:hidden;border:1px solid var(--line);}
      .progress-fill{height:100%;background:var(--accent);border-radius:99px;}
      .locknote{display:flex;gap:8px;align-items:center;color:var(--ink-faint);font-size:.88rem;font-weight:700;}
      .levelcard.locked{opacity:.75;}
      .status-chip{font-size:.78rem;font-weight:800;border-radius:999px;padding:4px 10px;}
      .chip-done{background:var(--green-soft);color:var(--green);}
      .chip-open{background:var(--accent-soft);color:var(--accent-strong);}
      .chip-lock{background:var(--panel-2);color:var(--ink-faint);}

      /* ---------- learn ---------- */
      .levelblock{margin-bottom:34px;}
      .level-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;margin-bottom:6px;}
      .level-head h2{font-size:1.45rem;}
      .level-head .tag{color:var(--ink-soft);font-size:.98rem;}
      .lessonlist{display:grid;gap:10px;margin:14px 0;}
      .lessonrow{
        display:flex;align-items:center;gap:14px;width:100%;text-align:left;
        background:var(--panel);border:1px solid var(--line);border-radius:16px;
        padding:16px;cursor:pointer;color:var(--ink);
      }
      .lessonrow:hover{border-color:var(--accent);}
      .lessonrow .n{flex:0 0 auto;width:38px;height:38px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--ink-soft);}
      .lessonrow.done .n{background:var(--green);border-color:var(--green);color:#fff;}
      .lessonrow h3{font-size:1.02rem;}
      .lessonrow p{margin:2px 0 0;color:var(--ink-soft);font-size:.88rem;}
      .lessonrow .chev{margin-left:auto;color:var(--ink-faint);font-size:1.2rem;flex:0 0 auto;}
      .lockedbox{background:var(--panel-2);border:1px dashed var(--line);border-radius:16px;padding:18px;color:var(--ink-soft);}

      /* ---------- lesson page ---------- */
      .lesson-hero h2{font-size:1.7rem;margin:6px 0 4px;}
      .lesson-hero .tagline{font-size:1.05rem;color:var(--ink-soft);}
      .playerbox{margin:20px 0;background:var(--navy);border-radius:var(--radius);padding:18px;color:#f6efdd;}
      .playerbox .plabel{display:flex;align-items:center;gap:10px;font-weight:800;font-size:.95rem;margin-bottom:10px;color:#f6efdd;}
      .playerbox audio{width:100%;}
      .playerbox .soon{color:#cdbd96;font-size:.9rem;}
      details.transcript{margin-top:12px;}
      details.transcript summary{cursor:pointer;font-weight:700;color:var(--accent);font-size:.92rem;}
      details.transcript p{color:#e8e0cc;font-size:.95rem;line-height:1.65;margin:10px 0 0;}
      .oneliner{
        background:var(--accent-soft);border-left:6px solid var(--accent);
        border-radius:12px;padding:16px 18px;font-size:1.05rem;font-weight:600;margin:22px 0;
      }
      .lesson-body h3{font-size:1.18rem;margin:26px 0 8px;}
      .lesson-body p{margin:0 0 12px;max-width:68ch;}
      .formula{
        background:var(--navy);color:#fdf6e3;border-radius:14px;padding:18px;
        font-family:var(--mono);font-size:1.02rem;text-align:center;margin:22px 0;overflow-wrap:anywhere;
      }
      .worked{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin:22px 0;box-shadow:var(--shadow);}
      .worked h3{margin-top:0;font-size:1.1rem;}
      .worked .setup{font-weight:700;}
      .worked ol{margin:10px 0;padding-left:22px;}
      .worked li{margin:6px 0;}
      .worked .answer{background:var(--green-soft);border-radius:10px;padding:12px 14px;font-weight:700;color:var(--ink);}
      .tryit{background:var(--blue-soft);border-radius:14px;padding:16px 18px;margin:22px 0;}
      .tryit .t-label{font-weight:800;font-size:.82rem;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);display:block;margin-bottom:6px;}
      .diagram{margin:22px 0;}
      .diagram img{width:100%;height:auto;border-radius:var(--radius);border:1px solid var(--line);display:block;background:var(--panel);}
      .diagram .placeholder{
        border:1px dashed var(--line);border-radius:var(--radius);background:var(--panel-2);
        padding:34px 20px;text-align:center;color:var(--ink-faint);font-weight:700;
      }
      .lesson-nav{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px;}
      .lesson-nav .btn{flex:1;min-width:150px;}
      .donecheck{display:flex;align-items:center;gap:10px;background:var(--green-soft);border-radius:12px;padding:14px 16px;font-weight:700;margin:22px 0;}

      /* ---------- video ---------- */
      .videobox{margin:16px 0;}
      .videobox video{width:100%;border-radius:var(--radius);border:1px solid var(--line);background:#000;display:block;}
      .videobox .placeholder{border:1px dashed var(--line);border-radius:var(--radius);background:var(--panel-2);padding:30px 20px;text-align:center;color:var(--ink-faint);font-weight:700;}

      /* ---------- quiz ---------- */
      .quizbar{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;color:var(--ink-soft);font-weight:700;margin-bottom:14px;}
      .qcard h2{font-size:1.3rem;margin-bottom:18px;}
      .opts{display:grid;gap:10px;}
      .opt{
        text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:14px;
        padding:16px;font-size:1.02rem;font-weight:600;cursor:pointer;color:var(--ink);min-height:56px;
      }
      .opt:hover{border-color:var(--accent);}
      .opt.correct{border-color:var(--green);background:var(--green-soft);}
      .opt.wrong{border-color:var(--red);background:var(--red-soft);}
      .opt:disabled{cursor:default;opacity:.9;}
      .explain{margin-top:16px;border-radius:12px;padding:14px 16px;font-size:.97rem;display:none;}
      .explain.show{display:block;}
      .explain.good{background:var(--green-soft);}
      .explain.bad{background:var(--red-soft);}
      .quiz-actions{margin-top:18px;display:flex;gap:12px;flex-wrap:wrap;}
      .scorebig{font-size:2.4rem;font-weight:900;line-height:1;}
      .passbanner{background:var(--green-soft);border-radius:14px;padding:16px 18px;font-weight:700;margin:16px 0;}
      .failbanner{background:var(--accent-soft);border-radius:14px;padding:16px 18px;font-weight:700;margin:16px 0;}

      /* ---------- calculators ---------- */
      .calc-grid{display:grid;gap:18px;}
      @media (min-width:900px){.calc-grid{grid-template-columns:1fr 1fr;}.calc-grid .wide{grid-column:1/-1;}}
      .field{margin-bottom:14px;}
      .field label{display:block;font-weight:700;font-size:.92rem;margin-bottom:6px;}
      .field .hint{font-size:.82rem;color:var(--ink-faint);font-weight:400;}
      .field input,.field select{
        width:100%;font-size:1.05rem;padding:12px 14px;border-radius:12px;
        border:2px solid var(--line);background:var(--panel);color:var(--ink);min-height:52px;font-family:inherit;
      }
      .field input[type=range]{padding:0;min-height:44px;accent-color:var(--accent);}
      .resultbox{background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:6px;}
      .resultbox .big{font-size:1.5rem;font-weight:900;}
      .resultbox .sentence{margin-top:8px;font-size:1.0rem;}
      .statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:12px;}
      .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;}
      .stat .v{font-size:1.25rem;font-weight:900;font-family:var(--mono);}
      .stat .k{font-size:.78rem;color:var(--ink-soft);font-weight:700;text-transform:uppercase;letter-spacing:.06em;}

      /* ---------- practice desk ---------- */
      .sim-layout{display:grid;gap:18px;}
      @media (min-width:900px){.sim-layout{grid-template-columns:1.5fr 1fr;align-items:start;}}
      .chartwrap{background:var(--navy);border-radius:var(--radius);padding:12px;border:1px solid var(--line);}
      canvas#simchart{width:100%;height:320px;display:block;border-radius:10px;touch-action:none;cursor:crosshair;}
      .chart-hint{color:#cdbd96;font-size:.85rem;margin-top:8px;}
      .feedback{border-radius:12px;padding:14px 16px;font-weight:600;margin:14px 0;display:none;}
      .feedback.show{display:block;}
      .feedback.info{background:var(--blue-soft);}
      .feedback.win{background:var(--green-soft);}
      .feedback.lose{background:var(--red-soft);}
      .journal{display:grid;gap:10px;margin-top:14px;}
      .jrow{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:.92rem;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;}
      .jrow .r-win{color:var(--green);font-weight:900;}
      .jrow .r-lose{color:var(--red);font-weight:900;}

      /* ---------- guide ---------- */
      .gstep{display:flex;gap:16px;margin-bottom:16px;}
      .gstep .gn{flex:0 0 auto;width:44px;height:44px;border-radius:50%;background:var(--navy);color:#f6efdd;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.1rem;}
      .gstep h3{font-size:1.08rem;margin-bottom:4px;}
      .gstep p{margin:0;color:var(--ink-soft);max-width:64ch;}

      @media (prefers-reduced-motion: reduce){
        *{transition:none !important;animation:none !important;}
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-in">
        <div class="brandmark" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none"><rect x="4" y="8" width="5" height="10" rx="1" fill="#5cc492"/><rect x="6.2" y="4" width="1" height="18" fill="#5cc492"/><rect x="12" y="5" width="5" height="13" rx="1" fill="#f0a84e"/><rect x="14.2" y="2" width="1" height="20" fill="#f0a84e"/><rect x="20" y="11" width="5" height="9" rx="1" fill="#f08a80"/><rect x="22.2" y="7" width="1" height="17" fill="#f08a80"/></svg>
        </div>
        <div class="brand">
          <h1>Stop-Loss Trading Lab</h1>
          <p id="brand-tagline">Learn to protect your money first. Trade second.</p>
        </div>
        <div class="spacer"></div>
        <div class="lang-toggle" role="group" aria-label="Language / Sprache">
          <button type="button" data-lang="en">EN</button>
          <button type="button" data-lang="de" class="active">DE</button>
        </div>
        <div class="pill-progress" id="topprogress">0 of 12 lessons done</div>
      </div>
    </header>

    <nav class="tabs" aria-label="Main">
      <div class="tabs-in">
        <button class="tab active" data-view="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg><span class="tab-label">Home</span></button>
        <button class="tab" data-view="learn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg><span class="tab-label">Learn</span></button>
        <button class="tab" data-view="calc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2.5" width="14" height="19" rx="2"/><path d="M8.5 6.5h7M8.5 11h.01M12 11h.01M15.5 11h.01M8.5 15h.01M12 15h.01M15.5 15h.01M8.5 19h.01M12 19h.01M15.5 19h.01"/></svg><span class="tab-label">Tools</span></button>
        <button class="tab" data-view="sim"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 3 6-8"/><path d="M14 6h4v4"/></svg><span class="tab-label">Practice</span></button>
        <button class="tab" data-view="guide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5 13 13l-4.5 2.5L11 11z"/></svg><span class="tab-label">Guide</span></button>
        <button class="tab" data-view="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg><span class="tab-label">Progress</span></button>
      </div>
    </nav>

    <main class="wrap">
      <section class="view active" id="view-home"></section>
      <section class="view" id="view-learn"></section>
      <section class="view" id="view-lesson"></section>
      <section class="view" id="view-quiz"></section>
      <section class="view" id="view-calc"></section>
      <section class="view" id="view-sim"></section>
      <section class="view" id="view-guide"></section>
      <section class="view" id="view-progress"></section>
    </main>

    <script>
    "use strict";
    /* ================================================================
       DATA — lesson text, quizzes, and guide are verbatim from
       curriculum.json (Stop-Loss Trading Lab).
       ================================================================ */
    var LEVELS = [
      {"id":"novice","name":"Level 1 · First Steps","tagline":"What a stop loss is, and the one rule that keeps you alive.","videoTopic":"What is a stop loss, explained with a driving analogy","video":"video-stop-loss.mp4"},
      {"id":"builder","name":"Level 2 · Size It Right","tagline":"Calculate exact lot size, and count every fee before you click.","videoTopic":"How to calculate lot size in three steps","video":"video-lot-size.mp4"},
      {"id":"pro","name":"Level 3 · Expert Novice","tagline":"Stronger beginner foundations: trailing stops, portfolio risk, expectancy, and TradingView essentials.","videoTopic":"Risk-to-reward and why fees decide who wins","video":"video-risk-reward.mp4"}
    ];
    var LESSONS = [
      {"id":"l01","level":"novice","title":"Your emergency brake: what a stop loss is","tagline":"The one tool that turns a scary trade into a planned, small loss.","oneLiner":"A stop loss is an automatic exit that closes your trade at a price you pick in advance, so a bad trade can only cost you a small, planned amount.","formula":"Max loss = (entry price − stop price) × size","diagram":"diagram-stop-loss.webp",
       "sections":[
         {"h":"Imagine driving with no brakes","p":["You would never drive a car with no brakes. But most beginners trade exactly like that: they buy something, the price falls, and they just sit there hoping it comes back. Hope is not a plan.","A stop loss is your brake pedal. Before you enter a trade, you decide: if the price falls to this level, I am out. Your broker closes the trade for you automatically, even while you sleep."]},
         {"h":"What it actually is","p":["A stop loss is an order you place with your broker at the same time as your trade. Example: you buy a stock at 50 dollars. You set your stop loss at 48 dollars. If the price drops to 48, your shares are sold automatically.","Your worst case is decided before the trade starts: (50 minus 48) times the number of shares. With 10 shares, the most you can lose is 20 dollars, plus tiny fees. No surprises."]},
         {"h":"Why it matters more than picking winners","p":["Every trader, even professionals, loses about half their trades. The difference between beginners who blow up their accounts and traders who survive is simple: survivors decide their maximum loss in advance.","One rule to remember: no single trade should ever be able to seriously hurt your account. The stop loss is how you enforce that."]},
         {"h":"One honest warning: slippage","p":["In very fast markets, your exit might fill a little below your stop price. That is called slippage. It is usually small, and it does not change the big idea: a stop loss still protects you from disaster."]}
       ],
       "workedExample":{"setup":"You buy 10 shares of a stock at $50. Stop loss at $48.","steps":["Stop distance = 50 − 48 = $2 per share.","Max loss = $2 × 10 shares = $20."],"answer":"The most this trade can cost you is $20 (plus small fees)."},
       "tryIt":"You buy at $100 and your stop is at $95. How much do you lose per share if stopped out? ($5)",
       "script":"Welcome to lesson one. Let's talk about the most important tool in trading. It is called a stop loss. Think of driving a car. You would never drive with no brakes, right? But most beginners trade exactly like that. They buy something, the price falls, and they just sit there, hoping it comes back up. Hope is not a plan. A stop loss is your brake pedal. Before you enter a trade, you pick a price and say, if it falls to here, I am out. Your broker closes the trade for you automatically, even while you sleep. Here is a simple example. You buy ten shares of a stock at fifty dollars. You set your stop loss at forty eight dollars. If the price drops to forty eight, your shares sell automatically. Your worst case was decided before the trade started. Fifty minus forty eight is two dollars per share, times ten shares, so the most you can lose is twenty dollars, plus tiny fees. No surprises. Remember this. Every trader loses about half their trades, even the pros. Survivors are the ones who decide their maximum loss in advance. One honest warning. In very fast markets, your exit can fill a little below your stop. That is called slippage. It is usually small, and it does not change the big idea. A stop loss protects you from disaster."},
      {"id":"l02","level":"novice","title":"The 1% rule: how much to risk","tagline":"The tiny rule that lets you survive ten losses in a row.","oneLiner":"Never risk more than about one percent of your account on a single trade.","formula":"Risk per trade = account balance × 0.01","diagram":"diagram-one-percent.webp",
       "sections":[
         {"h":"Risk is a budget, not a feeling","p":["Before you ask how much you could make, ask how much you can afford to lose. Professional traders answer with a number: about 1% of the account per trade.","On a 1,000 dollar account, 1% is 10 dollars. That means every trade you take is planned so the worst case costs you about 10 dollars. On a 5,000 dollar account, it is 50 dollars."]},
         {"h":"Why 1% saves you","p":["Losing streaks happen to everyone. Imagine you lose 10 trades in a row. Risking 1% each time, your account drops about 9.6%. You are annoyed, but you are still in the game.","Now imagine risking 10% per trade. Ten losses in a row wipes out about 65% of your account. You would need to nearly triple your money just to get back to zero. Almost nobody recovers from that."]},
         {"h":"The comfortable range","p":["Beginners should stay between half of one percent and two percent per trade. One percent is the classic starting point. If a trade needs more risk than that to make sense, the trade is too big, not too good."]}
       ],
       "workedExample":{"setup":"Your account has $2,000. You use the 1% rule.","steps":["Risk amount = 2,000 × 0.01 = $20."],"answer":"Every trade is planned so the worst case costs about $20."},
       "tryIt":"Your account has $3,500. At 1% risk, what is your max loss per trade? ($35)",
       "script":"Lesson two. The one percent rule. Before you ask how much you could make on a trade, ask how much you can afford to lose. Professional traders answer with a number. About one percent of the account, per trade. On a one thousand dollar account, one percent is ten dollars. Every trade is planned so the worst case costs about ten dollars. On a five thousand dollar account, it is fifty dollars. Why does this matter so much? Because losing streaks happen to everyone. Imagine you lose ten trades in a row. Risking one percent each time, your account drops about nine point six percent. You are annoyed, but you are still in the game. Now imagine risking ten percent per trade. Ten losses in a row wipes out about sixty five percent of your account. You would need to nearly triple your money just to get back to zero. Almost nobody recovers from that. As a beginner, stay between half a percent and two percent per trade. One percent is the classic starting point. And here is a filter you can use forever. If a trade needs more risk than that to make sense, the trade is too big, not too good."},
      {"id":"l03","level":"novice","title":"Measuring the distance: entry to stop","tagline":"Before you can size a trade, you must measure the gap.","oneLiner":"Stop distance is simply how far your stop sits from your entry price, measured in pips, dollars, or points.","formula":"Stop distance = |entry price − stop price|",
       "sections":[
         {"h":"It is just a gap","p":["Your entry is where you buy. Your stop is where you exit if you are wrong. The distance between them is the stop distance.","In forex, distance is measured in pips. If you buy euro dollar at 1.0850 and your stop is at 1.0830, the distance is 20 pips. In stocks, it is dollars per share: buy at 72, stop at 69, distance is 3 dollars."]},
         {"h":"Wild markets need wider stops","p":["Prices jump around more on some days than others. If your stop is too close in a wild market, normal wiggling will knock you out before the real move happens.","Traders measure typical wiggle with a tool called average true range, or A T R. You do not need the math yet. Just remember: calmer market, closer stop. Wilder market, wider stop, and therefore a smaller position size."]},
         {"h":"Distance decides your size","p":["Here is the key link: a wider stop means each unit you buy risks more dollars, so you must buy fewer units to keep the same 1% risk. Distance and size always move in opposite directions."]}
       ],
       "workedExample":{"setup":"You buy EUR/USD at 1.0850. Stop loss at 1.0830.","steps":["Distance = 1.0850 − 1.0830 = 0.0020 = 20 pips."],"answer":"Your stop distance is 20 pips."},
       "tryIt":"You buy a stock at $72, stop at $69. What is the stop distance? ($3 per share)",
       "script":"Lesson three. Measuring the distance. Your entry is where you buy. Your stop is where you exit if you are wrong. The gap between them is the stop distance, and everything in position sizing starts here. In forex, distance is measured in pips. If you buy euro dollar at one point zero eight five zero, and your stop is at one point zero eight three zero, the distance is twenty pips. In stocks, it is dollars per share. Buy at seventy two, stop at sixty nine, distance is three dollars. Now, wild markets need wider stops. Prices jump around more on some days. If your stop is too close on a wild day, normal wiggling knocks you out before the real move happens. Traders measure typical wiggle with a tool called average true range. You do not need the math yet. Just remember, calmer market, closer stop. Wilder market, wider stop, and therefore a smaller position size. Here is the key link for the next lesson. A wider stop means each unit you buy risks more dollars, so you must buy fewer units to keep the same one percent risk. Distance and size always move in opposite directions."},
      {"id":"l04","level":"novice","title":"Your first lot-size calculation","tagline":"Put risk and distance together and get your exact trade size.","oneLiner":"Lot size = risk dollars ÷ (stop distance × value per unit). It tells you exactly how much to buy.","formula":"Lots = risk $ ÷ (stop distance in pips × $ value per pip per lot)","diagram":"diagram-lot-size.webp",
       "sections":[
         {"h":"The only formula that matters at first","p":["You know your risk in dollars from the 1% rule. You know your stop distance from lesson 3. Lot size just connects them.","Lot size = risk dollars ÷ (stop distance × value per unit). In plain words: divide what you can afford to lose by what one unit would lose if the stop is hit."]},
         {"h":"A forex example, slowly","p":["Account: 1,000 dollars. Risk at 1%: 10 dollars. Stop distance: 20 pips. One standard lot moves about 10 dollars per pip.","Size = 10 ÷ (20 × 10) = 10 ÷ 200 = 0.05 lots. That is 5,000 units, also called 5 micro lots. If the stop is hit, you lose about 10 dollars. The math guarantees it."]},
         {"h":"Trust the math, not your gut","p":["Beginners guess their size. Guessing is how accounts die. From now on, every trade starts with three numbers: account, risk percent, stop distance. The calculator gives you the size. No feelings involved."]}
       ],
       "workedExample":{"setup":"$1,000 account, 1% risk = $10. Stop distance 20 pips. Standard lot = $10/pip.","steps":["Denominator = 20 × 10 = 200.","Lots = 10 ÷ 200 = 0.05."],"answer":"Trade 0.05 lots. If stopped out, you lose about $10."},
       "tryIt":"$2,000 account, 1% risk ($20), 25-pip stop. Size = 20 ÷ (25 × 10) = 0.08 lots.",
       "script":"Lesson four. Your first lot size calculation. You know your risk in dollars from the one percent rule. You know your stop distance from lesson three. Lot size just connects them. The formula is, lot size equals risk dollars, divided by stop distance times value per unit. In plain words, divide what you can afford to lose by what one unit would lose if the stop is hit. Let's do a forex example, slowly. Account, one thousand dollars. Risk at one percent, ten dollars. Stop distance, twenty pips. One standard lot moves about ten dollars per pip. Size equals ten, divided by twenty times ten. That is ten divided by two hundred, which is zero point zero five lots. That is five thousand units. If the stop is hit, you lose about ten dollars. The math guarantees it. Here is the habit to build. Beginners guess their size, and guessing is how accounts die. From now on, every trade starts with three numbers. Account, risk percent, stop distance. The calculator gives you the size. No feelings involved."}
    ];
    LESSONS.push(
      {"id":"l05","level":"builder","title":"The lot-size formula, step by step","tagline":"The universal sizing formula for stocks, forex, crypto, and futures.","oneLiner":"The universal rule: position size = risk dollars ÷ stop distance. It works for stocks, forex, crypto, and futures.","formula":"Shares = risk $ ÷ stop distance per share","diagram":"diagram-lot-size.webp",
       "sections":[
         {"h":"One formula, every market","p":["The universal rule: position size = risk dollars ÷ stop distance.","For stocks and crypto, one share or coin moves 1 dollar per 1 dollar of price, so: shares = risk dollars ÷ stop distance in dollars. For forex: lots = risk dollars ÷ (stop distance in pips × dollars per pip per lot). For futures: replace dollars per pip with the contract's tick value."]},
         {"h":"A stock example","p":["Account: 5,000 dollars. Risk at 1%: 50 dollars. Buy at 40, stop at 38. Stop distance = 2 dollars.","Shares = 50 ÷ 2 = 25 shares. If the stop is hit, you lose about 50 dollars. Guaranteed by the math, not by luck."]},
         {"h":"Three steps, every time","p":["Step 1: risk dollars, from your account and risk percent. Step 2: stop distance, from your chart. Step 3: divide. Bigger account, bigger size. Wider stop, smaller size. That is the whole game."]}
       ],
       "workedExample":{"setup":"$5,000 account, 1% risk = $50. Buy at $40, stop at $38.","steps":["Stop distance = 40 − 38 = $2.","Shares = 50 ÷ 2 = 25."],"answer":"Buy 25 shares. If stopped out, you lose about $50."},
       "tryIt":"$1,500 account, 2% risk ($30). Buy $60, stop $57 ($3 distance). Shares = 30 ÷ 3 = 10.",
       "script":"Lesson five. The lot size formula, step by step, for every market. Last lesson you learned the forex version. Now here is the universal rule that works everywhere. Position size equals risk dollars, divided by stop distance. For stocks and crypto, one share or one coin moves one dollar per dollar of price. So shares equals risk dollars divided by stop distance in dollars. Example. Account, five thousand dollars. Risk at one percent, fifty dollars. Buy at forty, stop at thirty eight. Stop distance is two dollars. Fifty divided by two is twenty five shares. If the stop is hit, you lose about fifty dollars. Guaranteed by math. For forex, you add the pip value step. Lots equals risk dollars divided by stop distance in pips, times dollars per pip per lot. For futures, replace dollars per pip with the tick value. The shape is always the same. Step one, risk dollars from your account and risk percent. Step two, stop distance from your chart. Step three, divide. Change any input and the size changes the right way automatically. Bigger account, bigger size. Wider stop, smaller size. That is the whole game."},
      {"id":"l06","level":"builder","title":"Pips, points, ticks, and contracts","tagline":"Translate every market's jargon into dollars per move.","oneLiner":"A pip is the smallest standard price step in forex; lot names just describe how many units you control.","formula":"1 standard lot = 100,000 units · 1 mini = 10,000 · 1 micro = 1,000",
       "sections":[
         {"h":"Every market has its own ruler","p":["Forex: the classic step is the pip. For most pairs a pip is 0.0001. If EUR/USD moves from 1.0850 to 1.0860, that is 10 pips. For yen pairs, a pip is 0.01. Some brokers also quote a point or pipette, which is one tenth of a pip.","Stocks: one share gains or loses 1 dollar per 1 dollar move. Crypto: one coin works the same way per coin. Futures: the smallest step is called a tick, and each contract has a fixed dollar value per tick."]},
         {"h":"Lot names, decoded","p":["In forex, a standard lot is 100,000 units. A mini lot is 10,000. A micro lot is 1,000.","So 0.10 lots is 10,000 units, about 1 dollar per pip. And 0.01 lots is 1,000 units, about 10 cents per pip."]},
         {"h":"Think in dollars per pip","p":["Your broker's buttons say lots, but your brain should think dollars per pip. Always translate: how many dollars do I gain or lose per pip at this size? Then the stop loss math is easy."]}
       ],
       "workedExample":{"setup":"You want each pip to be worth about $1.","steps":["Standard lot (1.00) ≈ $10/pip.","0.10 lots ≈ $1/pip."],"answer":"0.10 lots ≈ $1 per pip."},
       "tryIt":"You trade 0.01 lots (micro). About how much is one pip worth? ($0.10)",
       "script":"Lesson six. Pips, points, ticks, and contracts. Every market measures small moves differently. In forex, the classic step is the pip. For most pairs, a pip is zero point zero zero zero one. If euro dollar moves from one point zero eight five zero to one point zero eight six zero, that is ten pips. For yen pairs, a pip is zero point zero one. Some brokers also quote a point or pipette, which is one tenth of a pip. In stocks, one share gains or loses one dollar per one dollar move. Simple. In crypto, one coin works the same way per coin. In futures, the smallest step is called a tick, and each contract has a fixed dollar value per tick. Now lot names. In forex, a standard lot is one hundred thousand units. A mini lot is ten thousand. A micro lot is one thousand. So zero point one zero lots is ten thousand units, about one dollar per pip. Zero point zero one lots is one thousand units, about ten cents per pip. Why does this matter? Because your broker's buttons say lots, but your brain should think dollars per pip. Always translate. How many dollars do I gain or lose per pip at this size? Then the stop loss math is easy."},
      {"id":"l07","level":"builder","title":"Fees: the costs nobody shows you","tagline":"Count the hidden costs before every trade.","oneLiner":"Every trade starts slightly in the red: spread, commission, overnight fees, and slippage all come out of your profit.","formula":"Round-trip cost ≈ spread cost + (commission × 2)","diagram":"diagram-fees.webp",
       "sections":[
         {"h":"Every trade starts in the red","p":["Before price moves in your favor, you must first earn back your costs. There are four costs to know.","The spread is the gap between the buy price and the sell price. You always buy a little higher and sell a little lower. The spread is the broker's cut."]},
         {"h":"The other three costs","p":["Commission: some brokers charge a flat fee per trade, often both when you open and when you close.","Overnight fee, called swap: if you hold a forex or CFD trade overnight, you pay or earn a small daily interest amount.","Slippage: from lesson 1, your fills can be slightly worse than expected in fast markets."]},
         {"h":"Do the math before you click","p":["Example: you trade 0.05 lots of EUR/USD. The spread is 1.2 pips. One standard lot is about 10 dollars per pip. Spread cost = 1.2 × 10 × 0.05 = 0.60 dollars. Small on one trade, but fifty trades adds up.","The habit: before every trade, ask what the round-trip cost is, and whether the profit target covers it several times over. If fees eat more than about 10% of your target profit, the trade is probably not worth taking."]}
       ],
       "workedExample":{"setup":"0.05 lots EUR/USD. Spread 1.2 pips. Standard lot ≈ $10/pip.","steps":["Cost = 1.2 × 10 × 0.05 = $0.60."],"answer":"The spread costs you about $0.60 on this trade."},
       "tryIt":"Spread 2 pips, 0.10 lots. Cost = 2 × 10 × 0.10 = $2 per round trip.",
       "script":"Lesson seven. Fees, the costs nobody shows you. Every trade starts slightly in the red. Before price moves in your favor, you must first earn back your costs. There are four costs to know. First, the spread. That is the gap between the buy price and the sell price. You always buy a little higher and sell a little lower. The spread is the broker's cut. Second, commission. Some brokers charge a flat fee per trade, often both when you open and when you close. Third, the overnight fee, called swap. If you hold a forex or C F D trade overnight, you pay or earn a small daily interest amount. Fourth, slippage, from lesson one. Your fills can be slightly worse than expected in fast markets. Let's do the math. You trade zero point zero five lots of euro dollar. The spread is one point two pips. One standard lot is about ten dollars per pip. Spread cost equals one point two times ten times zero point zero five. That is sixty cents. Small on one trade, but do fifty trades and it adds up. Here is the habit. Before every trade, ask, what is my round trip cost, and is my profit target big enough to cover it several times over? If fees eat more than about ten percent of your target profit, the trade is probably not worth taking."},
      {"id":"l08","level":"builder","title":"Risk-to-reward: is the trade worth it?","tagline":"The ratio that lets you lose 6 out of 10 trades and still profit.","oneLiner":"Risk-to-reward tells you if a trade is worth taking: aim for at least 1:2, so you can be wrong most of the time and still win.","formula":"R:R = reward distance ÷ risk distance · Breakeven win rate = 1 ÷ (1 + R)","diagram":"diagram-risk-reward.webp",
       "sections":[
         {"h":"Is this trade even worth it?","p":["Risk-to-reward answers one question: for every dollar I risk, how many dollars could I make?","Reward distance ÷ risk distance. Buy EUR/USD at 1.0850, stop at 1.0830 (20 pips of risk), target at 1.0890 (40 pips of reward). 40 ÷ 20 = 2. That is a 1 to 2 risk-to-reward."]},
         {"h":"The magic: you can be wrong most of the time","p":["With a 1 to 2 ratio, you only need to win about 33% of your trades to break even. The math: breakeven win rate = 1 ÷ (1 + R). So 1 ÷ 3 = 33%.","Win 4 out of 10 trades at 1 to 2, and you are profitable. That is why professionals obsess over this number. It frees you from needing to be right all the time."]},
         {"h":"The rule of thumb","p":["Never take a trade below 1 to 1.5, and prefer 1 to 2 or better. A trade with a great setup but a 1 to 1 ratio is a coin flip with fees. Skip it."]}
       ],
       "workedExample":{"setup":"Risk 20 pips (1.0850 → 1.0830). Target 40 pips (→ 1.0890).","steps":["R:R = 40 ÷ 20 = 2.","Breakeven win rate = 1 ÷ (1+2) = 33%."],"answer":"A 1:2 trade. You can win just 4 of 10 and still profit."},
       "tryIt":"Risk $3/share, target $9 above entry. R:R = 9 ÷ 3 = 1:3. Take it!",
       "script":"Lesson eight. Risk to reward. Not every trade is worth taking, even with a perfect stop loss. Risk to reward answers one question. For every dollar I risk, how many dollars could I make? You find it by dividing. Reward distance divided by risk distance. Example. You buy euro dollar at one point zero eight five zero. Stop at one point zero eight three zero. That is twenty pips of risk. Your target is one point zero eight nine zero. That is forty pips of reward. Forty divided by twenty is two. A one to two risk reward. Now the magic. With a one to two ratio, you only need to win about thirty three percent of your trades to break even. The math: break even win rate equals one divided by one plus R. One divided by three is thirty three percent. Win four out of ten trades at one to two, and you are profitable. That is why professionals obsess over this number. It frees you from needing to be right all the time. The rule of thumb. Never take a trade below one to one point five, and prefer one to two or better. A trade with a great setup but a one to one ratio is a coin flip with fees. Skip it."}
    );
    LESSONS.push(
      {"id":"l09","level":"pro","title":"Trailing stops and moving to break-even","tagline":"Lock in profit while the trade is still running.","oneLiner":"Once a trade is winning, move your stop so the worst case becomes breaking even.","formula":"Break-even stop: move stop to entry once trade is +1R in profit","diagram":"diagram-trailing-stop.webp",
       "sections":[
         {"h":"Turn winners into free trades","p":["Your trade moves in your favor by 1 R, meaning it has gained as much as you risked. Now move your stop loss to your entry price.","The worst case is now zero, a scratch trade, instead of a full loss. Your risk just disappeared, but your upside is still open."]},
         {"h":"A worked example","p":["You buy a stock at 50 dollars, stop at 48. Price climbs to 54. That is 2 R of profit. You move your stop from 48 to 50.","If the price reverses, you exit at 50 with no loss. If it keeps climbing, you ride it."]},
         {"h":"Trailing stops automate it","p":["A trailing stop follows the price at a fixed distance. Price goes up, the stop creeps up behind it. Price falls, the stop stays put, and eventually price touches it and you exit with profit locked in.","Example: buy at 50, trailing stop of 2 dollars. Price reaches 56, so your stop is now at 54. Price dips to 54, you are out, with 4 dollars per share locked in."]},
         {"h":"The golden rule of moving stops","p":["Never move your stop further away when a trade goes against you. That turns a planned small loss into hope. Stops only move toward profit, never away from it."]}
       ],
       "workedExample":{"setup":"Buy at $50, trailing stop $2. Price climbs to $56, then dips.","steps":["Stop trails to 56 − 2 = $54.","Price touches $54 → exit. Profit = 54 − 50 = $4/share."],"answer":"You exit at $54 with $4 per share locked in."},
       "tryIt":"Buy $50, stop $48. Price hits $53 (+1.5R). Move stop to $50: worst case is now $0.",
       "script":"Lesson nine. Trailing stops and moving to break even. A stop loss protects you from big losses. But it can also protect your winners. Here is the classic move. Your trade goes in your favor by one R. That means it has gained as much as you risked. Now move your stop loss to your entry price. The worst case is now zero, a scratch trade, instead of a full loss. Your risk just disappeared. Example. You buy a stock at fifty dollars, stop at forty eight. Price climbs to fifty four. That is two R of profit. You move your stop from forty eight to fifty. If the price reverses, you exit at fifty, no loss. If it keeps climbing, you ride it. A trailing stop automates this idea. It is a stop that follows the price at a fixed distance. Price goes up, the stop creeps up behind it. Price falls, the stop stays put, and eventually price touches it and you exit with profit locked in. Example. You buy at fifty, trailing stop of two dollars. Price reaches fifty six. Your stop is now at fifty four. Price dips to fifty four, you are out, with four dollars per share locked in. One caution. Do not move your stop further away when a trade goes against you. That turns a planned small loss into hope. Stops only move toward profit, never away from it."},
      {"id":"l10","level":"pro","title":"Don't bet the farm twice: correlated risk","tagline":"Five 1% trades can secretly be one 5% gamble.","oneLiner":"Correlated trades multiply your risk. Count total open risk, not just per-trade risk.","formula":"Total heat = sum of risk % across all open trades (keep ≤ 3–6%)",
       "sections":[
         {"h":"Five safe trades can be one dangerous bet","p":["The 1% rule protects each trade. But with five trades open at once, your total open risk is called heat, and it can burn you.","The trap is correlation. Two trades can be secretly the same bet. Long EUR/USD and long GBP/USD is basically betting the dollar falls, twice. If the dollar surges, both stops get hit the same day. That is not two separate 1% risks. It is one 2% risk wearing a disguise."]},
         {"h":"The fix: add it up","p":["Add up the risk of every open trade. That total is your heat. Keep it under about 3 to 6% of your account.","Example: three trades each risking 1.5%. Total heat is 4.5%. If all three are dollar trades, that is too hot. Close one, or shrink the sizes."]},
         {"h":"The two questions before every trade","p":["What is my total heat right now? And does this trade bet on the same thing as something I already own? If yes, size it as one combined trade, not two separate ones."]}
       ],
       "workedExample":{"setup":"Three trades, each risking 1.5%, all long against the USD.","steps":["Total heat = 1.5 + 1.5 + 1.5 = 4.5%.","All three depend on the dollar falling → one combined bet."],"answer":"4.5% total heat on one theme — too hot. Reduce size or drop a trade."},
       "tryIt":"4 trades × 1% risk, all on USD pairs. Total heat = 4% on one theme — too hot. Trim to 2–3%.",
       "script":"Lesson ten. Do not bet the farm twice. The one percent rule protects each trade. But what if you have five trades open at once? Your total open risk is called heat, and it can burn you even when every trade follows the one percent rule. The trap is correlation. Two trades can be secretly the same bet. If you are long euro dollar and long pound dollar, you are basically betting the dollar falls, twice. If the dollar surges, both stops get hit on the same day. That is not two separate one percent risks. That is one two percent risk wearing a disguise. The fix is simple. Add up the risk of every open trade. That total is your heat. Keep it under about three to six percent of your account. Example. You have three trades, each risking one point five percent. Total heat is four point five percent. If all three are dollar trades, that is too hot. Close one, or shrink the sizes. Here is the habit. Before opening a new trade, ask two questions. What is my total heat right now? And does this trade bet on the same thing as something I already own? If yes to the second, size it as one combined trade, not two separate ones."},
      {"id":"l11","level":"pro","title":"Expectancy: are you actually winning?","tagline":"One number that separates skill from luck.","oneLiner":"Expectancy tells you, in plain math, whether your strategy actually makes money over many trades.","formula":"Expectancy = (win rate × avg win) − (loss rate × avg loss)",
       "sections":[
         {"h":"Luck or skill? One number answers","p":["Expectancy = (win rate × average win) − (loss rate × average loss). Measure wins and losses in R, from lesson 8.","It tells you what each trade earns you on average. Positive means the strategy makes money over time. Negative means it loses money, no matter how good individual trades feel."]},
         {"h":"A worked example","p":["You win 40% of trades. Average win is +2 R. Average loss is −1 R.","Expectancy = (0.40 × 2) − (0.60 × 1) = 0.8 − 0.6 = +0.2 R per trade. With 1% risk per trade, that is +0.2% per trade. Over 100 trades, expect roughly +20%."]},
         {"h":"Two rules for trusting it","p":["You need at least 30 trades, ideally 50, before the number means anything. Ten trades is noise.","Track every trade in a journal: entry, stop, target, size, and the R result. Your journal is the raw material. Without it, expectancy is a guess, and guesses are expensive."]}
       ],
       "workedExample":{"setup":"40% win rate. Avg win +2 R, avg loss −1 R.","steps":["Wins: 0.40 × 2 = 0.8.","Losses: 0.60 × 1 = 0.6.","Expectancy = 0.8 − 0.6 = +0.2 R."],"answer":"+0.2 R per trade. The strategy is profitable."},
       "tryIt":"50% wins, avg win +1.5R, avg loss −1R. Expectancy = (0.5×1.5) − (0.5×1) = +0.25R. Profitable!",
       "script":"Lesson eleven. Expectancy. The question every trader must answer. Am I actually good at this, or just lucky lately? Expectancy gives you the honest answer in one number. The formula: expectancy equals win rate times average win, minus loss rate times average loss. Measure wins and losses in R, from lesson eight. Example. You win forty percent of your trades. Your average win is plus two R. Your average loss is minus one R. Expectancy equals zero point four times two, minus zero point six times one. That is zero point eight minus zero point six, which is plus zero point two R. Every trade you take earns you, on average, zero point two R. With one percent risk per trade, that is zero point two percent per trade. Take one hundred trades, expect about twenty percent growth. If expectancy is negative, no mindset trick will save the strategy. Fix the strategy or stop trading it. Two rules. First, you need at least thirty trades, ideally fifty, before the number means anything. Ten trades is noise. Second, track every trade in a journal. Entry, stop, target, size, and the R result. Your journal is the raw material. Without it, expectancy is a guess, and guesses are expensive."},

       "script":"Lesson twelve. TradingView essentials. You have learned the math. Now let us make TradingView do the drawing for you. Open any chart. On the left toolbar, find the Long Position tool, or press Alt plus L on Windows, Option plus L on Mac. There is a Short Position tool next to it. Click your entry price, then drag down to your stop. A red box appears. That is your risk zone. Now drag upward to your target. A blue box appears. That is your reward zone. Look at the label on the box. TradingView shows you the stop distance, the target distance, and the risk reward ratio, automatically. If it says one to one, drag the target further or find a better trade. Next, read the stop distance from the tool, open the lot size calculator from level two, and get your exact size. No guessing. Two power features. First, alerts. Right click your stop line, choose Add Alert, and set it to trigger when price crosses the line. Your phone tells you the moment a trade closes. Second, practice with paper money. Open a paper trading account in TradingView, and use Bar Replay from the bottom toolbar to rewind any chart and trade it candle by candle, exactly like the simulator in this app, but with real history. Congratulations. You now know what most traders never learn. Protect the downside with stops, size with math, count the fees, and let winners run. Keep practicing, and the market will pay for your education in small, affordable lessons."}

    var LESSONS_DE = {
      "l01": {"title":"Deine Notbremse: Was ein Stop-Loss ist","tagline":"Das eine Werkzeug, das aus einem beängstigenden Trade einen geplanten, kleinen Verlust macht.","oneLiner":"Ein Stop-Loss ist ein automatischer Ausstieg, der deinen Trade zu einem Preis schließt, den du vorher festlegst. So kann ein schlechter Trade nur einen kleinen, geplanten Betrag kosten.","formula":"Max. Verlust = (Einstiegspreis − Stopppreis) × Größe",
       "sections":[
         {"h":"Stell dir Fahren ohne Bremsen vor","p":["Du würdest nie ein Auto ohne Bremsen fahren. Aber genau so traden die meisten Anfänger: Sie kaufen etwas, der Preis fällt, und sie sitzen einfach da und hoffen, dass er wieder steigt. Hoffnung ist kein Plan.","Ein Stop-Loss ist dein Bremspedal. Bevor du einen Trade eröffnest, entscheidest du: Wenn der Preis bis hierher fällt, bin ich raus. Dein Broker schließt den Trade automatisch für dich – sogar während du schläfst."]},
         {"h":"Was es wirklich ist","p":["Ein Stop-Loss ist ein Auftrag, den du bei deinem Broker gleichzeitig mit deinem Trade aufgibst. Beispiel: Du kaufst eine Aktie für 50 Dollar. Du setzt deinen Stop-Loss bei 48 Dollar. Fällt der Preis auf 48, werden deine Aktien automatisch verkauft.","Dein schlimmster Fall steht fest, bevor der Trade beginnt: (50 minus 48) mal die Anzahl der Aktien. Bei 10 Aktien kannst du höchstens 20 Dollar verlieren, plus kleine Gebühren. Keine Überraschungen."]},
         {"h":"Warum es wichtiger ist als Gewinner zu finden","p":["Jede Traderin und jeder Trader – sogar Profis – verliert etwa die Hälfte aller Trades. Der Unterschied zwischen Anfängern, deren Konto platzt, und Tradern, die überleben, ist einfach: Die Überlebenden legen ihren maximalen Verlust vorher fest.","Eine Regel zum Merken: Kein einziger Trade darf dein Konto ernsthaft verletzen können. Der Stop-Loss ist das Werkzeug, mit dem du diese Regel durchsetzt."]},
         {"h":"Eine ehrliche Warnung: Slippage","p":["In sehr schnellen Märkten kann dein Ausstieg etwas unter deinem Stopppreis ausgeführt werden. Das nennt man Slippage. Sie ist meist klein und ändert nichts an der großen Idee: Ein Stop-Loss schützt dich trotzdem vor einer Katastrophe."]}

       "workedExample":{"setup":"Du kaufst 10 Stück einer Aktie für $50. Stop-Loss bei $48.","steps":["Stoppabstand = 50 − 48 = $2 pro Aktie.","Max. Verlust = $2 × 10 Aktien = $20."],"answer":"Dieser Trade kann dich höchstens $20 kosten (plus kleine Gebühren)."},
       "tryIt":"Du kaufst für $100 und dein Stopp liegt bei $95. Wie viel verlierst du pro Aktie, wenn du ausgestoppt wirst? ($5)",
       "script":"Willkommen bei Lektion eins. Sprechen wir über das wichtigste Werkzeug beim Trading. Es heißt Stop-Loss. Stell dir vor, du fährst Auto. Du würdest nie ohne Bremsen fahren, oder? Aber genau so traden die meisten Anfänger. Sie kaufen etwas, der Preis fällt, und sie sitzen einfach da und hoffen, dass er wieder steigt. Hoffnung ist kein Plan. Ein Stop-Loss ist dein Bremspedal. Bevor du einen Trade eröffnest, wählst du einen Preis und sagst: Wenn es bis hierher fällt, bin ich raus. Dein Broker schließt den Trade automatisch für dich, sogar während du schläfst. Hier ist ein einfaches Beispiel. Du kaufst zehn Aktien für fünfzig Dollar. Du setzt deinen Stop-Loss bei achtundvierzig Dollar. Fällt der Preis auf achtundvierzig, verkaufen sich deine Aktien automatisch. Dein schlimmster Fall stand fest, bevor der Trade begonnen hat. Fünfzig minus achtundvierzig sind zwei Dollar pro Aktie, mal zehn Aktien – also kannst du höchstens zwanzig Dollar verlieren, plus kleine Gebühren. Keine Überraschungen. Merke dir das: Jede Traderin und jeder Trader verliert etwa die Hälfte der Trades, sogar die Profis. Wer überlebt, legt den maximalen Verlust vorher fest. Eine ehrliche Warnung: In sehr schnellen Märkten kann dein Ausstieg etwas unter deinem Stopp ausgeführt werden. Das nennt man Slippage. Sie ist meist klein und ändert nichts an der großen Idee. Ein Stop-Loss schützt dich vor einer Katastrophe."},
      "l02": {"title":"Die 1-%-Regel: Wie viel du riskieren darfst","tagline":"Die winzige Regel, mit der du zehn Verluste hintereinander überlebst.","oneLiner":"Riskiere bei einem einzelnen Trade nie mehr als etwa ein Prozent deines Kontos.","formula":"Risiko pro Trade = Kontostand × 0.01",
       "sections":[
         {"h":"Risiko ist ein Budget, kein Gefühl","p":["Bevor du fragst, wie viel du verdienen kannst, frag dich, wie viel du verlieren darfst. Profi-Trader antworten mit einer Zahl: etwa 1% des Kontos pro Trade.","Bei einem Konto mit 1,000 Dollar ist 1% gleich 10 Dollar. Das heißt: Jeder Trade wird so geplant, dass der schlimmste Fall etwa 10 Dollar kostet. Bei einem Konto mit 5,000 Dollar sind es 50 Dollar."]},
         {"h":"Warum dich 1% rettet","p":["Verlustserien passieren jeder und jedem. Stell dir vor, du verlierst 10 Trades hintereinander. Riskierst du jedes Mal 1%, sinkt dein Konto um etwa 9.6%. Du bist genervt, aber noch im Spiel.","Stell dir jetzt vor, du riskierst 10% pro Trade. Zehn Verluste hintereinander löschen etwa 65% deines Kontos aus. Du müsstest dein Geld fast verdreifachen, nur um wieder bei null zu sein. Davon erholt sich fast niemand."]},
         {"h":"Der angenehme Bereich","p":["Anfängerinnen und Anfänger sollten zwischen einem halben Prozent und zwei Prozent pro Trade bleiben. Ein Prozent ist der klassische Startpunkt. Wenn ein Trade mehr Risiko braucht, um Sinn zu ergeben, ist der Trade zu groß – nicht zu gut."]}

       "tryIt":"Dein Konto hat $3,500. Wie hoch ist dein maximaler Verlust pro Trade bei 1% Risiko? ($35)",
       "script":"Lektion zwei. Die Ein-Prozent-Regel. Bevor du fragst, wie viel du mit einem Trade verdienen kannst, frag dich, wie viel du verlieren darfst. Profi-Trader antworten mit einer Zahl: etwa ein Prozent des Kontos pro Trade. Bei einem Konto mit eintausend Dollar ist ein Prozent gleich zehn Dollar. Jeder Trade wird so geplant, dass der schlimmste Fall etwa zehn Dollar kostet. Bei einem Konto mit fünftausend Dollar sind es fünfzig Dollar. Warum ist das so wichtig? Weil Verlustserien jeder und jedem passieren. Stell dir vor, du verlierst zehn Trades hintereinander. Riskierst du jedes Mal ein Prozent, sinkt dein Konto um etwa neun Komma sechs Prozent. Du bist genervt, aber noch im Spiel. Stell dir jetzt vor, du riskierst zehn Prozent pro Trade. Zehn Verluste hintereinander löschen etwa fünfundsechzig Prozent deines Kontos aus. Du müsstest dein Geld fast verdreifachen, nur um wieder bei null zu sein. Davon erholt sich fast niemand. Bleib als Anfängerin zwischen einem halben Prozent und zwei Prozent pro Trade. Ein Prozent ist der klassische Startpunkt. Und hier ist ein Filter für immer: Wenn ein Trade mehr Risiko braucht, um Sinn zu ergeben, ist der Trade zu groß – nicht zu gut."},
      "l03": {"title":"Den Abstand messen: vom Einstieg bis zum Stopp","tagline":"Bevor du einen Trade dimensionieren kannst, musst du die Lücke messen.","oneLiner":"Der Stoppabstand ist einfach der Abstand zwischen deinem Stopp und deinem Einstiegspreis – gemessen in Pips, Dollar oder Punkten.","formula":"Stoppabstand = |Einstiegspreis − Stopppreis|",
       "sections":[
         {"h":"Es ist einfach eine Lücke","p":["Dein Einstieg ist der Preis, zu dem du kaufst. Dein Stopp ist der Preis, bei dem du aussteigst, wenn du falsch liegst. Der Abstand dazwischen ist der Stoppabstand.","Im Forex-Handel misst man den Abstand in Pips. Kaufst du Euro-Dollar bei 1.0850 und dein Stopp liegt bei 1.0830, beträgt der Abstand 20 Pips. Bei Aktien sind es Dollar pro Aktie: Kauf bei 72, Stopp bei 69, Abstand 3 Dollar."]},
         {"h":"Wilde Märkte brauchen weitere Stopps","p":["An manchen Tagen springen die Preise mehr herum als an anderen. Liegt dein Stopp in einem wilden Markt zu nah, wirft dich das normale Hin und Her raus, bevor die echte Bewegung beginnt.","Trader messen das typische Schwanken mit einem Werkzeug namens Average True Range, kurz ATR. Die Mathematik brauchst du noch nicht. Merk dir nur: ruhiger Markt, näherer Stopp. Wilder Markt, weiterer Stopp – und deshalb eine kleinere Positionsgröße."]},
         {"h":"Der Abstand bestimmt deine Größe","p":["Hier ist die entscheidende Verbindung: Ein weiterer Stopp bedeutet, dass jede Einheit, die du kaufst, mehr Dollar riskiert. Also musst du weniger Einheiten kaufen, um dasselbe 1-%-Risiko zu halten. Abstand und Größe bewegen sich immer in entgegengesetzte Richtungen."]}
